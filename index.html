<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Buster</title>
  <meta name="description" content="Block Buster is a vivid, fast Tetris clone that follows the modern Guideline: 7-bag, SRS rotation, hold, ghost piece, T-spins and back-to-back bonuses.">
  <meta name="theme-color" content="#120a2a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23120a2a'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2.5' fill='%2335f2ff'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2.5' fill='%23ffd23f'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2.5' fill='%23b44dff'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2.5' fill='%23ff4fa3'/%3E%3C/svg%3E">
  <style>
    /* ---------- Colors ---------- */
    :root {
      --bg: #120a2a;
      --panel: rgba(28, 20, 60, 0.62);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #f4f1ff;
      --muted: #a79cd6;
      --yellow: #ffd23f;
      --orange: #ff8a00;
      --pink: #ff4fa3;
      --cyan: #35f2ff;
      --green: #6dff9a;
      --violet: #b44dff;
      --accent-ink: #1a1000;
    }

    /* ---------- Base page ---------- */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html {
      background: #0d0820;
      min-height: 100%;
    }
    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 32px;
      overflow-x: hidden;
      background: linear-gradient(165deg, #190d3d 0%, #120a2a 45%, #0a1636 100%);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Soft colored light blobs drifting behind the game */
    .blob {
      position: fixed;
      z-index: 0;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.4;
      pointer-events: none;
      animation: drift 24s ease-in-out infinite alternate;
    }
    .blob-1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -10vmax; background: #7b2cff; }
    .blob-2 { width: 40vmax; height: 40vmax; right: -14vmax; top: 20vh; background: #ff4fa3; animation-duration: 30s; }
    .blob-3 { width: 36vmax; height: 36vmax; left: 20vw; bottom: -18vmax; background: #35f2ff; opacity: 0.22; animation-duration: 36s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(6vmax, 4vmax) scale(1.12); }
    }

    .brand, .game, .touch, .help { position: relative; z-index: 1; }

    /* ---------- Title ---------- */
    .brand h1 {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.34em;
      margin: 0 0 22px 0.34em;
      background: linear-gradient(90deg, var(--cyan), var(--yellow), var(--pink), var(--violet), var(--cyan));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 7s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 0% 50%; }
      to   { background-position: 300% 50%; }
    }

    /* ---------- Layout: HOLD | board | NEXT and stats ---------- */
    .game {
      display: grid;
      grid-template-columns: 150px auto 170px;
      grid-template-areas: "hold board side";
      gap: 20px;
      align-items: start;
    }
    .hold-panel { grid-area: hold; }
    .board-wrap { grid-area: board; position: relative; justify-self: center; }
    .side { grid-area: side; display: flex; flex-direction: column; gap: 12px; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .stat + .stat { margin-top: 14px; }
    .stat-value {
      display: inline-block;
      font-size: 26px;
      font-weight: 900;
      margin: 0;
      font-variant-numeric: tabular-nums;
      transform-origin: left center;
    }
    .stat-value.score { background: linear-gradient(180deg, #fff6c2, var(--yellow) 50%, var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stat-value.level { color: var(--cyan); text-shadow: 0 0 14px rgba(53, 242, 255, 0.5); }
    .stat-value.lines { color: var(--green); text-shadow: 0 0 14px rgba(109, 255, 154, 0.4); }
    .stat-value.best  { color: var(--pink); text-shadow: 0 0 14px rgba(255, 79, 163, 0.5); }

    .progress {
      height: 6px;
      margin-top: 9px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
      box-shadow: 0 0 10px rgba(180, 77, 255, 0.7);
      transition: width 0.35s ease;
    }

    /* ---------- Playfield and previews ---------- */
    #board {
      display: block;
      height: min(78vh, 640px);
      width: auto;
      background: #0b0720;
      border: 1px solid rgba(180, 150, 255, 0.22);
      border-radius: 16px;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.03), 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    #holdCanvas, #nextCanvas {
      display: block;
      margin: 0 auto;
    }
    #holdCanvas { width: 120px; height: 90px; }
    #nextCanvas { width: 120px; height: 320px; }

    /* Flash of color over the board, used on big busts */
    .screen-flash {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* Big BUST callout that pops over the playfield */
    .callout {
      position: absolute;
      left: 50%;
      top: 30%;
      width: 100%;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }
    .callout-main {
      font-size: 38px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.03em;
      margin: 0;
      background: linear-gradient(180deg, #ffffff 0%, var(--yellow) 48%, var(--orange) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 #6b2100) drop-shadow(0 0 18px rgba(255, 170, 40, 0.7));
    }
    .callout-sub {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      margin: 10px 0 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }
    .callout.tetris .callout-main {
      background: linear-gradient(180deg, #ffffff 0%, #ffb3e6 35%, var(--pink) 70%, var(--violet) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 4px 0 #3a0b4a) drop-shadow(0 0 22px rgba(255, 79, 163, 0.85));
    }
    .callout.tspin .callout-main {
      background: linear-gradient(180deg, #ffffff 0%, var(--cyan) 50%, var(--violet) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 4px 0 #1d0b4a) drop-shadow(0 0 22px rgba(53, 242, 255, 0.8));
    }
    .callout.triple .callout-main {
      background: linear-gradient(180deg, #ffffff 0%, var(--cyan) 60%, #2d7dff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 4px 0 #062c4a) drop-shadow(0 0 18px rgba(53, 242, 255, 0.7));
    }
    .callout.double .callout-main {
      background: linear-gradient(180deg, #ffffff 0%, var(--green) 60%, #1fc96a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 4px 0 #0a3a1c) drop-shadow(0 0 18px rgba(109, 255, 154, 0.7));
    }

    /* Start, pause and game-over card drawn over the playfield */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(12, 7, 32, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 16px;
      transition: opacity 0.3s ease, visibility 0.3s;
    }
    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .overlay-card { text-align: center; max-width: 280px; }
    .overlay-title {
      font-size: 34px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.04em;
      margin: 0 0 10px;
      background: linear-gradient(180deg, #ffffff, var(--yellow) 55%, var(--orange));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 #6b2100);
    }
    .overlay-text {
      font-size: 16px;
      margin: 0 0 20px;
      opacity: 0.92;
    }
    .overlay-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 18px 0 0;
    }
    .btn-primary {
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: var(--accent-ink);
      background: linear-gradient(180deg, #fff09a, var(--yellow) 50%, var(--orange));
      border: 0;
      border-radius: 14px;
      padding: 13px 34px;
      cursor: pointer;
      box-shadow: 0 6px 0 #a8500a, 0 12px 26px rgba(255, 160, 40, 0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #a8500a, 0 6px 14px rgba(255, 160, 40, 0.3);
    }
    .btn-primary:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

    /* ---------- Controls help (wide screens) ---------- */
    .help {
      display: none;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      margin: 24px 0 0;
    }

    /* ---------- Touch buttons (small screens only) ---------- */
    .touch { display: none; }
    .touch button {
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 50%), rgba(70, 56, 130, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 14px 0;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .touch button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
    .touch [data-action="left"], .touch [data-action="right"], .touch [data-action="down"] { background-color: rgba(53, 130, 220, 0.9); }
    .touch [data-action="rotateCW"], .touch [data-action="rotateCCW"] { background-color: rgba(190, 70, 170, 0.9); }
    .touch [data-action="hardDrop"] { background-color: rgba(230, 160, 20, 0.95); color: #1a1000; }
    .touch [data-action="hold"] { background-color: rgba(120, 70, 230, 0.9); }

    /* ---------- Small screens (below 600 px wide) ---------- */
    @media (max-width: 599px) {
      body { padding: 16px 16px 24px; }
      .brand h1 { margin-bottom: 14px; }
      .game {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "board board"
          "hold side";
        gap: 12px;
        width: 100%;
        max-width: 420px;
      }
      #board { height: min(64vh, 640px); }
      .callout-main { font-size: 26px; }
      .overlay-title { font-size: 28px; }
      .touch {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 100%;
        max-width: 420px;
        margin-top: 16px;
      }
    }

    @media (min-width: 600px) {
      .help { display: block; }
    }

    /* Respect users who ask for less motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      .blob, .brand h1 { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>

  <header class="brand">
    <h1>BLOCK BUSTER</h1>
  </header>

  <main class="game">
    <!-- HOLD -->
    <section class="panel hold-panel">
      <h2 class="label">HOLD</h2>
      <canvas id="holdCanvas"></canvas>
    </section>

    <!-- Playfield, callouts and overlay cards -->
    <section class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="screenFlash" class="screen-flash"></div>
      <div id="callout" class="callout" aria-live="polite">
        <p id="calloutMain" class="callout-main"></p>
        <p id="calloutSub" class="callout-sub"></p>
      </div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <p id="overlayTitle" class="overlay-title"></p>
          <p id="overlayText" class="overlay-text"></p>
          <button id="overlayButton" class="btn-primary" hidden></button>
          <p id="overlayHint" class="overlay-hint"></p>
        </div>
      </div>
    </section>

    <div class="side">
      <!-- NEXT -->
      <section class="panel next-panel">
        <h2 class="label">NEXT</h2>
        <canvas id="nextCanvas"></canvas>
      </section>

      <!-- SCORE, LEVEL, LINES, BEST -->
      <section class="panel stats-panel">
        <div class="stat">
          <h2 class="label">SCORE</h2>
          <p id="score" class="stat-value score">0</p>
        </div>
        <div class="stat">
          <h2 class="label">LEVEL</h2>
          <p id="level" class="stat-value level">1</p>
          <div class="progress"><span id="levelBar"></span></div>
        </div>
        <div class="stat">
          <h2 class="label">LINES</h2>
          <p id="lines" class="stat-value lines">0</p>
        </div>
        <div class="stat">
          <h2 class="label">BEST</h2>
          <p id="best" class="stat-value best">0</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Touch buttons (shown below 600 px) -->
  <div id="touchControls" class="touch">
    <button data-action="left">Left</button>
    <button data-action="right">Right</button>
    <button data-action="down">Down</button>
    <button data-action="rotateCW">Rotate</button>
    <button data-action="rotateCCW">Rotate CCW</button>
    <button data-action="hardDrop">Drop</button>
    <button data-action="hold">Hold</button>
    <button data-action="pause">Pause</button>
    <button data-action="restart">Restart</button>
  </div>

  <!-- Keyboard help (shown on wide screens) -->
  <p class="help">
    ← → move · ↓ soft drop · ↑ or X rotate clockwise · Z rotate counterclockwise<br>
    Space hard drop · C or Shift hold · P or Esc pause · R restart
  </p>

  <script>
    // ============================================================
    // 1. SETTINGS AND CONSTANTS
    // ============================================================

    // Board size: 10 columns, 20 visible rows, and 2 hidden rows above them for spawning.
    const COLS = 10;
    const VISIBLE_ROWS = 20;
    const BUFFER_ROWS = 2;
    const ROWS = VISIBLE_ROWS + BUFFER_ROWS;

    // Spawn position. The piece's box starts at column 3 and row 1,
    // so the bottom of every piece lands on the top visible row (row 2).
    const SPAWN_X = 3;
    const SPAWN_Y = 1;

    // Drawing sizes, in logical pixels. The canvases are scaled to the screen for sharp output.
    const CELL = 30;                 // one block on the playfield
    const BOARD_W = COLS * CELL;
    const BOARD_H = VISIBLE_ROWS * CELL;
    const PREVIEW_CELL = 14;         // one block in HOLD and NEXT
    const HOLD_W = 120;
    const HOLD_H = 90;
    const NEXT_W = 120;
    const NEXT_H = 320;
    const NEXT_COUNT = 5;            // how many upcoming pieces to show

    // Timing, in seconds.
    const LOCK_DELAY = 0.5;
    const MAX_LOCK_RESETS = 15;
    const DAS = 0.167;               // delay before a held left/right starts repeating
    const ARR = 0.033;               // time between repeated moves
    const SOFT_DROP_INTERVAL = 0.05; // time per row while Down is held
    const CLEAR_FLASH_TIME = 0.25;   // how long cleared rows flash before they disappear
    const LOCK_PULSE_TIME = 0.2;     // white flash on blocks as they lock
    const SHAKE_TIME = 0.35;         // how long the screen shakes after a bust
    const POPUP_TIME = 0.9;          // how long a floating score number lasts

    // Helper tuning. The helper is strongest at score 0 and is gone by this score.
    const ASSIST_FADE_SCORE = 10000;

    // Animation tuning.
    const VISUAL_SMOOTHING = 26;     // higher = the falling piece catches up to its real spot faster
    const PARTICLE_GRAVITY = 900;    // pixels per second squared
    const MAX_PARTICLES = 320;
    const GAME_OVER_ROWS_PER_SECOND = 18;
    const SHAKE_BY_CLEAR = [0, 1.5, 3, 4.5, 7];  // shake strength for 0-4 rows cleared
    const SPRITE_PX = 96;            // resolution of the glossy block pictures

    // Respect the operating system's "reduce motion" setting: no shake, particles or sliding.
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Colors. The seven piece colors keep the standard Guideline hues, made brighter for the glossy look.
    const COLORS = {
      I: '#22f0ff',
      O: '#ffe226',
      T: '#b04dff',
      S: '#3dff5f',
      Z: '#ff3350',
      J: '#3d6bff',
      L: '#ff9a1f',
    };
    const COLOR_FIELD = '#0b0720';
    const COLOR_GRID = 'rgba(170, 150, 255, 0.1)';
    const COLOR_FLASH = 'rgba(255, 255, 255, 0.45)';
    const COLOR_DEAD = '#343c58';    // grey blocks that fill the board on game over

    const PIECE_NAMES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
    const CLEAR_NAMES = ['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS'];
    const BEST_KEY = 'blockBusterBest';

    // Piece shapes. Each piece has 4 rotation states:
    // 0 = spawn, 1 = clockwise, 2 = 180 degrees, 3 = counterclockwise.
    // Each state lists the [x, y] offsets of the 4 blocks inside the piece's box (y goes down).
    const SHAPES = {
      I: [
        [[0, 1], [1, 1], [2, 1], [3, 1]],
        [[2, 0], [2, 1], [2, 2], [2, 3]],
        [[0, 2], [1, 2], [2, 2], [3, 2]],
        [[1, 0], [1, 1], [1, 2], [1, 3]],
      ],
      O: [
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
      ],
      T: [
        [[1, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [1, 1], [2, 1], [1, 2]],
        [[0, 1], [1, 1], [2, 1], [1, 2]],
        [[1, 0], [0, 1], [1, 1], [1, 2]],
      ],
      J: [
        [[0, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [1, 2]],
        [[0, 1], [1, 1], [2, 1], [2, 2]],
        [[1, 0], [1, 1], [0, 2], [1, 2]],
      ],
      L: [
        [[2, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [1, 1], [1, 2], [2, 2]],
        [[0, 1], [1, 1], [2, 1], [0, 2]],
        [[0, 0], [1, 0], [1, 1], [1, 2]],
      ],
      S: [
        [[1, 0], [2, 0], [0, 1], [1, 1]],
        [[1, 0], [1, 1], [2, 1], [2, 2]],
        [[1, 1], [2, 1], [0, 2], [1, 2]],
        [[0, 0], [0, 1], [1, 1], [1, 2]],
      ],
      Z: [
        [[0, 0], [1, 0], [1, 1], [2, 1]],
        [[2, 0], [1, 1], [2, 1], [1, 2]],
        [[0, 1], [1, 1], [1, 2], [2, 2]],
        [[1, 0], [0, 1], [1, 1], [0, 2]],
      ],
    };

    // SRS wall kick tests for J, L, S, T, Z.
    // Each entry is [x, y] with y pointing UP (the Tetris Wiki convention).
    // The key is "from>to", where the numbers are rotation states.
    const KICKS_JLSTZ = {
      '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
      '1>0': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      '2>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
      '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
      '3>2': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
      '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
      '0>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    };

    // SRS wall kick tests for I (same format as above).
    const KICKS_I = {
      '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      '1>0': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
      '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
      '2>1': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
      '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
      '3>2': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
      '0>3': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    };

    // Keyboard codes mapped to game actions.
    const KEY_ACTIONS = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowDown: 'down',
      ArrowUp: 'rotateCW',
      KeyX: 'rotateCW',
      KeyZ: 'rotateCCW',
      Space: 'hardDrop',
      KeyC: 'hold',
      ShiftLeft: 'hold',
      ShiftRight: 'hold',
      KeyP: 'pause',
      Escape: 'pause',
      KeyR: 'restart',
      Enter: 'confirm',
      NumpadEnter: 'confirm',
    };

    // ============================================================
    // 2. GAME STATE
    // ============================================================

    let board = [];            // ROWS rows of COLS cells; each cell is null or a piece letter
    let current = null;        // the falling piece: { type, rot, x, y }
    let holdType = null;       // piece letter in the HOLD slot
    let canHold = true;        // false after a hold until the next lock
    let pieceBag = [];         // remaining pieces in the current 7-bag
    let nextQueue = [];        // upcoming piece letters, shown in NEXT
    let score = 0;
    let level = 1;
    let lines = 0;
    let best = 0;
    let bestAtStart = 0;       // the best score when this game began (for "New best!")
    let lastClearWasHard = false; // was the previous line clear a Tetris or T-spin? (for back-to-back)
    let state = 'playing';     // 'playing', 'paused', or 'over'
    let flashRows = [];        // rows currently flashing after a line clear
    let flashTimer = 0;
    let gravityTimer = 0;
    let lockTimer = 0;
    let lockResets = 0;
    let lastMoveWasRotation = false; // used for T-spin detection
    let lastKick = -1;         // which wall kick test the last rotation used (-1 = rotation failed)
    let moveDir = 0;           // -1 left, 1 right, 0 none (held direction for auto-shift)
    let moveTimer = 0;
    let dasDone = false;       // has the DAS delay finished for the held direction?
    let softDropping = false;  // is Down held?
    let softTimer = 0;
    let lastFrameTime = null;

    // Visual-only state (animations). None of this affects the rules.
    let visual = { x: SPAWN_X, y: SPAWN_Y };   // smoothed on-screen spot of the falling piece
    let particles = [];        // sparks that burst out of cleared rows
    let popups = [];           // floating score numbers
    let pulses = [];           // white flashes on blocks that just locked
    let shake = { time: 0, duration: SHAKE_TIME, amount: 0 };
    let overProgress = 0;      // rows of grey filled in during the game-over animation
    let overlayAction = null;  // what the overlay button does right now
    let calloutTimer = null;

    // Page elements we update often.
    const boardCanvas = document.getElementById('board');
    const holdCanvas = document.getElementById('holdCanvas');
    const nextCanvas = document.getElementById('nextCanvas');
    let boardCtx = null;       // set by layoutCanvases()
    let holdCtx = null;
    let nextCtx = null;
    const scoreText = document.getElementById('score');
    const levelText = document.getElementById('level');
    const linesText = document.getElementById('lines');
    const bestText = document.getElementById('best');
    const levelBar = document.getElementById('levelBar');
    const calloutEl = document.getElementById('callout');
    const calloutMain = document.getElementById('calloutMain');
    const calloutSub = document.getElementById('calloutSub');
    const screenFlashEl = document.getElementById('screenFlash');
    const overlayEl = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const overlayHint = document.getElementById('overlayHint');
    const overlayButton = document.getElementById('overlayButton');

    // ============================================================
    // 3. BOARD AND PIECE HELPERS
    // ============================================================

    // Make one empty row of the board.
    function makeEmptyRow() {
      return new Array(COLS).fill(null);
    }

    // Make an empty board with ROWS rows.
    function makeEmptyBoard() {
      const newBoard = [];
      for (let row = 0; row < ROWS; row++) {
        newBoard.push(makeEmptyRow());
      }
      return newBoard;
    }

    // Return the board positions a piece occupies.
    function getCells(piece) {
      return SHAPES[piece.type][piece.rot].map(([dx, dy]) => ({
        x: piece.x + dx,
        y: piece.y + dy,
      }));
    }

    // Return true if the piece fits on the given grid: inside the walls and floor, and not overlapping any block.
    function fitsOn(grid, piece) {
      return getCells(piece).every((cell) =>
        cell.x >= 0 && cell.x < COLS &&
        cell.y >= 0 && cell.y < ROWS &&
        grid[cell.y][cell.x] === null
      );
    }

    // Return true if the piece fits on the real board.
    function fits(piece) {
      return fitsOn(board, piece);
    }

    // A spot counts as blocked if it is a wall, the floor, or a locked block. Used for T-spin checks.
    function isBlocked(x, y) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
      return board[y][x] !== null;
    }

    // Return true if the piece cannot move down one row.
    function isGrounded() {
      return !fits({ ...current, y: current.y + 1 });
    }

    // Find the row where the current piece would land if dropped straight down (the ghost).
    function ghostY() {
      let landY = current.y;
      while (fits({ ...current, y: landY + 1 })) {
        landY++;
      }
      return landY;
    }

    // ============================================================
    // 4. RANDOMIZER (7-BAG) AND THE HELPER
    // ============================================================

    // Shuffle an array in place (Fisher-Yates).
    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    // How strong the helper is, from 1 (score 0) down to 0 (score ASSIST_FADE_SCORE).
    // The squared curve keeps the help generous early and fades it out gently.
    function assistStrength(currentScore) {
      const progress = Math.min(1, currentScore / ASSIST_FADE_SCORE);
      return (1 - progress) * (1 - progress);
    }

    // Take one piece from the bag.
    // Sometimes (more often early on) the helper looks at the pieces left in the bag
    // and takes the one that fits the board best. It only changes the order inside
    // the bag, so every bag of 7 still contains each piece exactly once.
    function takeFromBag() {
      if (pieceBag.length === 0) {
        pieceBag = shuffle([...PIECE_NAMES]);
      }
      if (Math.random() < assistStrength(score)) {
        let bestIndex = pieceBag.length - 1;
        let bestFit = -Infinity;
        pieceBag.forEach((type, index) => {
          const fit = bestPlacementScore(type);
          if (fit > bestFit) {
            bestFit = fit;
            bestIndex = index;
          }
        });
        return pieceBag.splice(bestIndex, 1)[0];
      }
      return pieceBag.pop();
    }

    // Find the best score any placement of this piece gets on the current board.
    // Tries every rotation and column, drops the piece, and rates the result.
    function bestPlacementScore(type) {
      let bestFit = -Infinity;
      for (let rot = 0; rot < 4; rot++) {
        for (let x = -2; x < COLS + 2; x++) {
          const piece = { type, rot, x, y: SPAWN_Y };
          if (!fitsOn(board, piece)) continue;
          while (fitsOn(board, { ...piece, y: piece.y + 1 })) {
            piece.y++;
          }
          const grid = board.map((row) => row.slice());
          for (const cell of getCells(piece)) {
            grid[cell.y][cell.x] = type;
          }
          bestFit = Math.max(bestFit, scoreGrid(grid));
        }
      }
      return bestFit;
    }

    // Rate a board: reward cleared lines, penalize height, holes and bumpiness.
    // These weights are the well-known Dellacherie values.
    function scoreGrid(grid) {
      // Remove full rows and count them.
      let cleared = 0;
      const kept = grid.filter((row) => {
        const full = row.every((cell) => cell !== null);
        if (full) cleared++;
        return !full;
      });
      while (kept.length < ROWS) {
        kept.unshift(makeEmptyRow());
      }

      // Column heights, and their total.
      const heights = [];
      for (let col = 0; col < COLS; col++) {
        const topRow = kept.findIndex((row) => row[col] !== null);
        heights.push(topRow === -1 ? 0 : ROWS - topRow);
      }
      const totalHeight = heights.reduce((sum, h) => sum + h, 0);

      // Holes: empty cells with a block somewhere above them in the same column.
      let holes = 0;
      for (let col = 0; col < COLS; col++) {
        let blockSeen = false;
        for (let row = 0; row < ROWS; row++) {
          if (kept[row][col] !== null) blockSeen = true;
          else if (blockSeen) holes++;
        }
      }

      // Bumpiness: how uneven the top of the stack is.
      let bumpiness = 0;
      for (let col = 0; col < COLS - 1; col++) {
        bumpiness += Math.abs(heights[col] - heights[col + 1]);
      }

      return -0.51 * totalHeight + 0.76 * cleared - 0.36 * holes - 0.18 * bumpiness;
    }

    // Keep the NEXT queue full so the preview always has enough pieces.
    function fillNextQueue() {
      while (nextQueue.length < NEXT_COUNT) {
        nextQueue.push(takeFromBag());
      }
    }

    // Take the next piece for play and refill the queue.
    function takeNextType() {
      const type = nextQueue.shift();
      fillNextQueue();
      return type;
    }

    // ============================================================
    // 5. GRAVITY
    // ============================================================

    // Seconds for a piece to fall one row at this level.
    function gravityInterval(lvl) {
      return Math.pow(0.8 - (lvl - 1) * 0.007, lvl - 1);
    }

    // ============================================================
    // 6. MOVING AND ROTATING
    // ============================================================

    // Move the piece by (dx, dy) if there is room. Used by gravity and soft drop. Does not reset lock delay.
    function shiftPiece(dx, dy) {
      if (!fits({ ...current, x: current.x + dx, y: current.y + dy })) {
        return false;
      }
      current.x += dx;
      current.y += dy;
      lastMoveWasRotation = false;
      return true;
    }

    // Move the piece because the player pressed a key. A successful move can reset the lock delay.
    function playerMove(dx, dy) {
      if (!shiftPiece(dx, dy)) {
        return false;
      }
      resetLockTimerIfGrounded();
      return true;
    }

    // After a successful move or rotation while grounded, restart the lock timer.
    // This only happens up to MAX_LOCK_RESETS times per piece.
    function resetLockTimerIfGrounded() {
      if (!isGrounded()) {
        lockTimer = 0;
        return;
      }
      if (lockResets < MAX_LOCK_RESETS) {
        lockTimer = 0;
        lockResets++;
      }
    }

    // Rotate the piece clockwise (dir = 1) or counterclockwise (dir = -1) using SRS wall kicks.
    function rotatePiece(dir) {
      lastKick = -1;
      if (current.type === 'O') {
        return false; // the O piece does not rotate visibly
      }

      const newRot = (current.rot + (dir === 1 ? 1 : 3)) % 4;
      const kickKey = `${current.rot}>${newRot}`;
      const kickTests = current.type === 'I' ? KICKS_I[kickKey] : KICKS_JLSTZ[kickKey];

      // Try each kick in order. The first one that fits wins.
      for (let i = 0; i < kickTests.length; i++) {
        const [dx, dy] = kickTests[i];
        const candidate = { type: current.type, rot: newRot, x: current.x + dx, y: current.y - dy };
        if (fits(candidate)) {
          current.rot = candidate.rot;
          current.x = candidate.x;
          current.y = candidate.y;
          lastKick = i;
          lastMoveWasRotation = true;
          resetLockTimerIfGrounded();
          return true;
        }
      }
      return false;
    }

    // ============================================================
    // 7. PER-FRAME GAME UPDATES
    // ============================================================

    // Auto-shift: after DAS, a held left or right moves once every ARR.
    function updateAutoShift(dt) {
      if (moveDir === 0) return;
      moveTimer += dt;
      if (!dasDone) {
        if (moveTimer < DAS) return;
        dasDone = true;
        moveTimer -= DAS;
      }
      while (moveTimer >= ARR) {
        moveTimer -= ARR;
        if (!playerMove(moveDir, 0)) {
          moveTimer = 0;
          break;
        }
      }
    }

    // Soft drop: while Down is held, move one row every SOFT_DROP_INTERVAL. Each row is worth 1 point.
    function updateSoftDrop(dt) {
      if (!softDropping) return;
      softTimer += dt;
      while (softTimer >= SOFT_DROP_INTERVAL) {
        softTimer -= SOFT_DROP_INTERVAL;
        if (!shiftPiece(0, 1)) {
          softTimer = 0;
          break;
        }
        addScore(1);
      }
    }

    // Gravity: the piece falls one row every gravityInterval(level) seconds.
    function updateGravity(dt) {
      gravityTimer += dt;
      const interval = gravityInterval(level);
      let rowsFallen = 0;
      while (gravityTimer >= interval && rowsFallen < ROWS) {
        gravityTimer -= interval;
        rowsFallen++;
        if (!shiftPiece(0, 1)) {
          gravityTimer = 0;
          break;
        }
      }
    }

    // Lock delay: a grounded piece locks after LOCK_DELAY seconds.
    function updateLockDelay(dt) {
      if (!isGrounded()) {
        lockTimer = 0;
        return;
      }
      lockTimer += dt;
      if (lockTimer >= LOCK_DELAY) {
        lockPiece();
      }
    }

    // Advance the game by dt seconds.
    function update(dt) {
      // During a line-clear flash nothing moves. When the flash ends, the rows are removed.
      if (flashRows.length > 0) {
        flashTimer -= dt;
        if (flashTimer <= 0) {
          finishLineClear();
        }
        return;
      }
      if (!current) return;

      updateAutoShift(dt);
      updateSoftDrop(dt);
      updateGravity(dt);
      updateLockDelay(dt);
    }

    // ============================================================
    // 8. SPAWNING, HOLD AND HARD DROP
    // ============================================================

    // Put a new piece of this type at the top of the board. If it does not fit, the game is over.
    function placeNewPiece(type) {
      current = { type, rot: 0, x: SPAWN_X, y: SPAWN_Y };
      visual = { x: current.x, y: current.y };
      lockTimer = 0;
      lockResets = 0;
      gravityTimer = 0;
      lastMoveWasRotation = false;
      if (!fits(current)) {
        endGame();
      }
    }

    // Spawn the next piece from the queue.
    function spawnPiece() {
      placeNewPiece(takeNextType());
    }

    // Swap the current piece with the HOLD slot. Allowed once per piece; canHold comes back on lock.
    function holdCurrentPiece() {
      if (!canHold || !current) return false;

      const pieceToHold = current.type;
      if (holdType === null) {
        holdType = pieceToHold;
        spawnPiece();
      } else {
        const pieceToPlay = holdType;
        holdType = pieceToHold;
        placeNewPiece(pieceToPlay);
      }
      canHold = false;
      return true;
    }

    // Drop the piece straight to its landing row (2 points per row), then lock it right away.
    function hardDrop() {
      const distance = ghostY() - current.y;
      if (distance > 0) {
        lastMoveWasRotation = false;
        startShake(1);
      }
      current.y += distance;
      addScore(distance * 2);
      if (distance >= 3 && !REDUCED_MOTION) {
        const landedRow = current.y - BUFFER_ROWS;
        addPopup(`+${distance * 2}`, (current.x + 1.5) * CELL, (landedRow + 0.5) * CELL, '#ffffff');
      }
      lockPiece();
    }

    // ============================================================
    // 9. LOCKING, LINE CLEARS AND SCORING
    // ============================================================

    // T-spin check (3-corner rule): the last move was a rotation, and at least
    // 3 of the 4 corners around the T's center are blocked.
    function isTSpin() {
      if (current.type !== 'T' || !lastMoveWasRotation) return false;

      // The T's box is 3x3, so its center is at offset (1, 1).
      const centerX = current.x + 1;
      const centerY = current.y + 1;
      const corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
      const blockedCount = corners.filter(([dx, dy]) =>
        isBlocked(centerX + dx, centerY + dy)
      ).length;
      return blockedCount >= 3;
    }

    // Return the row numbers that are completely filled.
    function findFullRows() {
      const fullRows = [];
      for (let y = 0; y < ROWS; y++) {
        if (board[y].every((cell) => cell !== null)) {
          fullRows.push(y);
        }
      }
      return fullRows;
    }

    // Lock the falling piece into the board, score any cleared lines, then spawn the next piece.
    function lockPiece() {
      const tSpin = isTSpin();
      const lockedCells = getCells(current);
      for (const cell of lockedCells) {
        board[cell.y][cell.x] = current.type;
      }
      addLockPulses(lockedCells);
      current = null;
      canHold = true;

      const fullRows = findFullRows();
      if (fullRows.length > 0) {
        const award = awardLines(fullRows.length, tSpin);
        flashRows = fullRows;
        flashTimer = CLEAR_FLASH_TIME;
        spawnClearBurst(fullRows);
        celebrateClear(award, fullRows);
      } else {
        if (tSpin) {
          const points = 400 * level; // T-spin with no lines cleared
          addScore(points);
          showCallout('T-SPIN', `+${points}`, 'tspin');
          flashScreen('#35f2ff', 0.35);
        }
        spawnPiece();
      }
    }

    // Score a line clear and update lines and level. Returns what happened so the celebration can match it.
    // Normal: single 100, double 300, triple 500, Tetris 800 (times level).
    // T-spin: single 800, double 1200, triple 1600 (times level).
    // Back-to-back Tetris or T-spin clears get 1.5x.
    function awardLines(count, tSpin) {
      const isHard = count === 4 || tSpin;
      let points = tSpin
        ? [800, 1200, 1600][count - 1]
        : [100, 300, 500, 800][count - 1];
      points *= level;

      const backToBack = isHard && lastClearWasHard;
      if (backToBack) {
        points = Math.floor(points * 1.5);
      }
      addScore(points);
      lastClearWasHard = isHard;

      const oldLevel = level;
      lines += count;
      level = Math.floor(lines / 10) + 1;
      return { count, tSpin, points, backToBack, leveledUp: level > oldLevel, levelNow: level };
    }

    // Add points to the score, and update BEST if the score beats it.
    function addScore(points) {
      score += points;
      if (score > best) {
        best = score;
        saveBest();
      }
    }

    // After the flash, remove the cleared rows and add empty rows at the top.
    function finishLineClear() {
      board = board.filter((row, y) => !flashRows.includes(y));
      while (board.length < ROWS) {
        board.unshift(makeEmptyRow());
      }
      flashRows = [];
      spawnPiece();
    }

    // ============================================================
    // 10. GAME FLOW (start, restart, pause, game over)
    // ============================================================

    // Reset everything about the game except the falling piece.
    function prepareNewGame() {
      board = makeEmptyBoard();
      pieceBag = [];
      nextQueue = [];
      fillNextQueue();
      holdType = null;
      canHold = true;
      score = 0;
      level = 1;
      lines = 0;
      lastClearWasHard = false;
      bestAtStart = best;
      flashRows = [];
      flashTimer = 0;
      moveDir = 0;
      softDropping = false;
      particles = [];
      popups = [];
      pulses = [];
      shake.amount = 0;
      shake.time = shake.duration;
      overProgress = 0;
      hideCallout();
    }

    // Start a new game from scratch.
    function resetGame() {
      prepareNewGame();
      state = 'playing';
      spawnPiece();
      refreshOverlay();
    }

    // Stop the game. The board fills with grey, then the game-over card appears.
    function endGame() {
      state = 'over';
      current = null;
      moveDir = 0;
      softDropping = false;
      overProgress = REDUCED_MOTION ? ROWS : 0;
      refreshOverlay();
    }

    // Pause or resume. Does nothing unless the game is running or paused.
    function togglePause() {
      if (state === 'playing') {
        state = 'paused';
      } else if (state === 'paused') {
        state = 'playing';
      } else {
        return;
      }
      moveDir = 0;
      softDropping = false;
      refreshOverlay();
    }

    // ============================================================
    // 11. HIGH SCORE SAVING
    // ============================================================

    // Read the saved high score. If storage is blocked, use 0.
    function loadBest() {
      try {
        return Number(localStorage.getItem(BEST_KEY)) || 0;
      } catch (err) {
        return 0;
      }
    }

    // Save the high score. If storage is blocked, the score just is not saved.
    function saveBest() {
      try {
        localStorage.setItem(BEST_KEY, String(best));
      } catch (err) {
        // ignore: storage is not available
      }
    }

    // ============================================================
    // 12. INPUT (keyboard, touch and overlay buttons all use these)
    // ============================================================

    // Start an action. Left, right and down keep going while held; the others happen once.
    function pressAction(action) {
      // Game over: only explicit restart keys work, so a stray Space does not wipe the score.
      if (state === 'over') {
        if (action === 'confirm' || action === 'restart') resetGame();
        return;
      }
      // Paused: only resume and restart work.
      if (state === 'paused') {
        if (action === 'pause' || action === 'confirm') togglePause();
        else if (action === 'restart') resetGame();
        return;
      }

      // Playing.
      if (action === 'pause') {
        togglePause();
        return;
      }
      if (action === 'restart') {
        resetGame();
        return;
      }
      if (!current) return;

      if (action === 'left') startAutoShift(-1);
      else if (action === 'right') startAutoShift(1);
      else if (action === 'down') {
        softDropping = true;
        softTimer = SOFT_DROP_INTERVAL; // first row falls right away
      }
      else if (action === 'rotateCW') rotatePiece(1);
      else if (action === 'rotateCCW') rotatePiece(-1);
      else if (action === 'hardDrop') hardDrop();
      else if (action === 'hold') holdCurrentPiece();
    }

    // Stop a held action (only left, right and down need this).
    function releaseAction(action) {
      if (action === 'left' && moveDir === -1) moveDir = 0;
      if (action === 'right' && moveDir === 1) moveDir = 0;
      if (action === 'down') softDropping = false;
    }

    // Move once right away, then repeat after DAS.
    function startAutoShift(dir) {
      playerMove(dir, 0);
      moveDir = dir;
      moveTimer = 0;
      dasDone = false;
    }

    // Keyboard: pressing a key starts its action; releasing it stops a held action.
    document.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      const action = KEY_ACTIONS[event.code];
      if (!action) return;
      event.preventDefault();
      if (event.repeat) return; // ignore OS key repeat; left, right and down repeat with our own timers
      pressAction(action);
    });

    document.addEventListener('keyup', (event) => {
      const action = KEY_ACTIONS[event.code];
      if (action) releaseAction(action);
    });

    // Touch buttons: press starts the action, releasing stops held actions.
    document.querySelectorAll('#touchControls button').forEach((button) => {
      const action = button.dataset.action;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        pressAction(action);
      });
      button.addEventListener('pointerup', () => releaseAction(action));
      button.addEventListener('pointerleave', () => releaseAction(action));
      button.addEventListener('pointercancel', () => releaseAction(action));
      button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    // The card's button (Resume, Play again). Blur afterwards so Space cannot press it again.
    overlayButton.addEventListener('click', () => {
      overlayButton.blur();
      if (overlayAction) pressAction(overlayAction);
    });

    // ============================================================
    // 13. ANIMATION: SMOOTH MOTION, SPARKS, GLOW, SHAKE, CALLOUTS
    // ============================================================

    // Ease the falling piece toward its real position so sideways moves and drops glide.
    function updateVisuals(dt) {
      if (!current) return;
      if (REDUCED_MOTION) {
        visual = { x: current.x, y: current.y };
        return;
      }
      const amount = 1 - Math.exp(-VISUAL_SMOOTHING * dt);
      visual.x += (current.x - visual.x) * amount;
      visual.y += (current.y - visual.y) * amount;
      if (Math.abs(current.x - visual.x) < 0.01) visual.x = current.x;
      if (Math.abs(current.y - visual.y) < 0.01) visual.y = current.y;
    }

    // Advance sparks, score numbers, lock pulses, screen shake and the game-over fill.
    // This runs in real time, so the effects keep playing during the flash.
    function updateEffects(dt) {
      shake.time += dt;

      for (const p of particles) {
        p.vy += PARTICLE_GRAVITY * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      }
      particles = particles.filter((p) => p.life > 0);

      for (const popup of popups) {
        popup.y -= 42 * dt;
        popup.life -= dt;
      }
      popups = popups.filter((popup) => popup.life > 0);

      for (const pulse of pulses) {
        pulse.life -= dt;
      }
      pulses = pulses.filter((pulse) => pulse.life > 0);

      if (state === 'over' && overProgress < VISIBLE_ROWS) {
        overProgress = Math.min(VISIBLE_ROWS, overProgress + dt * GAME_OVER_ROWS_PER_SECOND);
        if (overProgress >= VISIBLE_ROWS) {
          refreshOverlay();
        }
      }
    }

    // Start a screen shake. The shake fades out over SHAKE_TIME.
    function startShake(strength) {
      if (REDUCED_MOTION) return;
      shake.amount = Math.max(strength, shake.time < shake.duration ? shake.amount : 0);
      shake.time = 0;
      shake.duration = SHAKE_TIME;
    }

    // Current shake offset in logical pixels. Zero when no shake is running.
    function shakeOffset() {
      if (shake.time >= shake.duration) return { x: 0, y: 0 };
      const strength = shake.amount * (1 - shake.time / shake.duration);
      return {
        x: (Math.random() * 2 - 1) * strength,
        y: (Math.random() * 2 - 1) * strength,
      };
    }

    // Make a block that flashes white for a moment when it locks in place.
    function addLockPulses(cells) {
      if (REDUCED_MOTION) return;
      for (const cell of cells) {
        if (cell.y < BUFFER_ROWS) continue;
        pulses.push({ col: cell.x, visibleRow: cell.y - BUFFER_ROWS, life: LOCK_PULSE_TIME });
      }
    }

    // Make one spark at (x, y) that flies outward and fades.
    function makeParticle(x, y, color) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 260;
      const life = 0.45 + Math.random() * 0.45;
      return {
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 80,
        life,
        maxLife: life,
        color,
        size: 3 + Math.random() * 4,
      };
    }

    // Burst sparks from every block in the cleared rows (two per block, capped overall).
    function spawnClearBurst(rows) {
      if (REDUCED_MOTION) return;
      for (const row of rows) {
        if (row < BUFFER_ROWS) continue;
        for (let col = 0; col < COLS; col++) {
          const type = board[row][col];
          if (!type) continue;
          const x = col * CELL + CELL / 2;
          const y = (row - BUFFER_ROWS) * CELL + CELL / 2;
          for (let i = 0; i < 2 && particles.length < MAX_PARTICLES; i++) {
            particles.push(makeParticle(x, y, COLORS[type]));
          }
        }
      }
    }

    // Add a floating score number at (x, y) in logical board pixels.
    function addPopup(text, x, y, color) {
      if (REDUCED_MOTION) return;
      popups.push({ text, x, y, color, life: POPUP_TIME, maxLife: POPUP_TIME });
    }

    // Show the big BUST text, shake the screen, glow the board, and buzz on phones for a line clear.
    function celebrateClear(award, rows) {
      let main = 'BUST!';
      let kind = 'single';
      if (award.tSpin) {
        main = 'T-SPIN BUST!';
        kind = 'tspin';
      } else if (award.count === 4) {
        main = 'TETRIS BUST!';
        kind = 'tetris';
      } else if (award.count === 3) {
        main = 'TRIPLE BUST!';
        kind = 'triple';
      } else if (award.count === 2) {
        main = 'DOUBLE BUST!';
        kind = 'double';
      }

      const parts = [`+${award.points}`];
      if (award.backToBack) parts.push('Back-to-back');
      if (award.leveledUp) parts.push(`Level ${award.levelNow}`);
      showCallout(main, parts.join('  ·  '), kind);

      // Score number at the middle of the cleared rows.
      const visibleRows = rows.filter((row) => row >= BUFFER_ROWS).map((row) => row - BUFFER_ROWS);
      const middleRow = visibleRows.length ? visibleRows.reduce((a, b) => a + b, 0) / visibleRows.length : 0;
      addPopup(`+${award.points}`, BOARD_W / 2, (middleRow + 0.5) * CELL, '#ffe26b');

      const glow = { tetris: '#ff4fa3', tspin: '#35f2ff', triple: '#35f2ff', double: '#6dff9a', single: '#ffd23f' }[kind];
      flashScreen(glow, award.count === 4 || award.tSpin ? 0.5 : 0.22);
      pulseBoard(glow);

      startShake(SHAKE_BY_CLEAR[award.count]);
      if (navigator.vibrate) {
        navigator.vibrate(award.count * 25);
      }
    }

    // Show the callout text with a bouncy pop-in, hold, then fade out. kind picks its colors.
    function showCallout(main, sub, kind = 'single') {
      calloutEl.className = `callout ${kind}`;
      calloutMain.textContent = main;
      calloutSub.textContent = sub;
      if (REDUCED_MOTION) {
        calloutEl.style.opacity = '1';
        clearTimeout(calloutTimer);
        calloutTimer = setTimeout(hideCallout, 1200);
        return;
      }
      calloutEl.animate([
        { opacity: 0, transform: 'translate(-50%, -50%) scale(0.5)' },
        { opacity: 1, transform: 'translate(-50%, -50%) scale(1.12)', offset: 0.22 },
        { opacity: 1, transform: 'translate(-50%, -50%) scale(0.98)', offset: 0.34 },
        { opacity: 1, transform: 'translate(-50%, -50%) scale(1)', offset: 0.42 },
        { opacity: 1, transform: 'translate(-50%, -50%) scale(1)', offset: 0.72 },
        { opacity: 0, transform: 'translate(-50%, -64%) scale(1)' },
      ], { duration: 1300, easing: 'ease-out' });
    }

    // Hide the callout straight away (used when a new game starts).
    function hideCallout() {
      clearTimeout(calloutTimer);
      calloutEl.style.opacity = '0';
    }

    // Flash a soft colored light over the whole board. strength is 0 to 1.
    function flashScreen(color, strength) {
      if (REDUCED_MOTION) return;
      screenFlashEl.style.background = `radial-gradient(circle at 50% 40%, ${color} 0%, transparent 70%)`;
      screenFlashEl.animate([
        { opacity: strength },
        { opacity: 0 },
      ], { duration: 520, easing: 'ease-out' });
    }

    // Make the board's edge glow in a color for a moment.
    function pulseBoard(color) {
      if (REDUCED_MOTION) return;
      boardCanvas.animate([
        { boxShadow: '0 0 0 6px rgba(255,255,255,0.03), 0 20px 60px rgba(0,0,0,0.5)' },
        { boxShadow: `0 0 0 6px ${color}55, 0 0 60px 10px ${color}aa, 0 20px 60px rgba(0,0,0,0.5)` },
        { boxShadow: '0 0 0 6px rgba(255,255,255,0.03), 0 20px 60px rgba(0,0,0,0.5)' },
      ], { duration: 800, easing: 'ease-out' });
    }

    // Briefly bump a number when it changes.
    function popElement(el, text) {
      const hadValue = el.textContent !== '';
      el.textContent = text;
      if (hadValue && !REDUCED_MOTION) {
        el.animate([
          { transform: 'scale(1.25)' },
          { transform: 'scale(1)' },
        ], { duration: 260, easing: 'ease-out' });
      }
    }

    // ============================================================
    // 14. DRAWING
    // ============================================================

    // Size a canvas to its on-screen size (times the screen density) so it looks sharp.
    // Drawing code keeps using the logical sizes (BOARD_W, HOLD_W, ...).
    function fitCanvas(canvas, logicalW, logicalH) {
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(canvas.clientWidth * dpr));
      canvas.height = Math.max(1, Math.round(canvas.clientHeight * dpr));
      ctx.setTransform(canvas.width / logicalW, 0, 0, canvas.height / logicalH, 0, 0);
      return ctx;
    }

    // Set up all three canvases. Called at start and whenever the window size changes.
    function layoutCanvases() {
      boardCtx = fitCanvas(boardCanvas, BOARD_W, BOARD_H);
      holdCtx = fitCanvas(holdCanvas, HOLD_W, HOLD_H);
      nextCtx = fitCanvas(nextCanvas, NEXT_W, NEXT_H);
    }

    // Mix a color toward white (target 255) or black (target 0). amount is 0 to 1.
    function mixColor(hex, target, amount) {
      const n = parseInt(hex.slice(1), 16);
      const parts = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
        .map((v) => Math.round(v + (target - v) * amount));
      return `rgb(${parts[0]}, ${parts[1]}, ${parts[2]})`;
    }

    // Draw a rounded rectangle path (works in every browser).
    function traceRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Glossy block pictures are drawn once per color and reused: a bright top, a rich body,
    // a darker base, and a soft gloss highlight.
    const spriteCache = {};
    function getBlockSprite(color) {
      if (spriteCache[color]) return spriteCache[color];

      const sprite = document.createElement('canvas');
      sprite.width = SPRITE_PX;
      sprite.height = SPRITE_PX;
      const g = sprite.getContext('2d');
      const pad = SPRITE_PX * 0.04;
      const size = SPRITE_PX - pad * 2;
      const radius = SPRITE_PX * 0.16;

      const body = g.createLinearGradient(0, pad, 0, pad + size);
      body.addColorStop(0, mixColor(color, 255, 0.45));
      body.addColorStop(0.45, color);
      body.addColorStop(1, mixColor(color, 0, 0.38));
      traceRoundRect(g, pad, pad, size, size, radius);
      g.fillStyle = body;
      g.fill();

      const gloss = g.createLinearGradient(0, pad, 0, pad + size * 0.5);
      gloss.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      gloss.addColorStop(1, 'rgba(255, 255, 255, 0)');
      traceRoundRect(g, pad + SPRITE_PX * 0.07, pad + SPRITE_PX * 0.07, size - SPRITE_PX * 0.14, size * 0.4, radius * 0.6);
      g.fillStyle = gloss;
      g.fill();

      traceRoundRect(g, pad + 1, pad + 1, size - 2, size - 2, radius);
      g.strokeStyle = 'rgba(0, 0, 0, 0.28)';
      g.lineWidth = 2;
      g.stroke();

      spriteCache[color] = sprite;
      return sprite;
    }

    // Draw one glossy tile at (x, y) with the given size.
    function drawTile(ctx, x, y, size, color) {
      ctx.drawImage(getBlockSprite(color), x, y, size, size);
    }

    // Draw one block on the playfield. visibleRow counts from the top of the visible area.
    function drawBlock(ctx, col, visibleRow, color) {
      drawTile(ctx, col * CELL, visibleRow * CELL, CELL, color);
    }

    // Draw the thin grid lines behind the playfield.
    function drawGridLines(ctx) {
      ctx.strokeStyle = COLOR_GRID;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let col = 1; col < COLS; col++) {
        const x = col * CELL + 0.5;
        ctx.moveTo(x, 0);
        ctx.lineTo(x, BOARD_H);
      }
      for (let row = 1; row < VISIBLE_ROWS; row++) {
        const y = row * CELL + 0.5;
        ctx.moveTo(0, y);
        ctx.lineTo(BOARD_W, y);
      }
      ctx.stroke();
    }

    // Draw a soft glowing outline where the current piece would land.
    function drawGhost(ctx) {
      const landY = ghostY();
      ctx.strokeStyle = COLORS[current.type];
      ctx.shadowColor = COLORS[current.type];
      ctx.shadowBlur = 10;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2;
      for (const cell of getCells({ ...current, y: landY })) {
        if (cell.y < BUFFER_ROWS) continue;
        traceRoundRect(ctx, cell.x * CELL + 3, (cell.y - BUFFER_ROWS) * CELL + 3, CELL - 6, CELL - 6, 6);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // Draw the falling piece at its smoothed position.
    function drawFallingPiece(ctx) {
      for (const cell of getCells({ ...current, x: visual.x, y: visual.y })) {
        if (cell.y >= BUFFER_ROWS) {
          drawBlock(ctx, cell.x, cell.y - BUFFER_ROWS, COLORS[current.type]);
        }
      }
    }

    // Draw the cleared rows: a white wash plus a light beam that sweeps across them.
    function drawFlashRows(ctx) {
      if (flashRows.length === 0) return;
      const progress = Math.min(1, Math.max(0, 1 - flashTimer / CLEAR_FLASH_TIME));
      const beamX = progress * (BOARD_W + 160) - 80;
      for (const row of flashRows) {
        if (row < BUFFER_ROWS) continue;
        const y = (row - BUFFER_ROWS) * CELL;
        ctx.fillStyle = COLOR_FLASH;
        ctx.fillRect(0, y, BOARD_W, CELL);
        const beam = ctx.createLinearGradient(beamX - 80, 0, beamX + 80, 0);
        beam.addColorStop(0, 'rgba(255, 255, 255, 0)');
        beam.addColorStop(0.5, 'rgba(255, 255, 255, 0.95)');
        beam.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = beam;
        ctx.fillRect(0, y, BOARD_W, CELL);
      }
    }

    // Draw the fading white flashes on freshly locked blocks.
    function drawPulses(ctx) {
      for (const pulse of pulses) {
        const alpha = 0.55 * (pulse.life / LOCK_PULSE_TIME);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
        ctx.fillRect(pulse.col * CELL, pulse.visibleRow * CELL, CELL, CELL);
      }
    }

    // Draw the sparks from cleared rows. They glow by adding their light together.
    function drawParticles(ctx) {
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * alpha), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // Draw the floating score numbers. They rise, grow a little, and fade.
    function drawPopups(ctx) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.lineJoin = 'round';
      for (const popup of popups) {
        const t = popup.life / popup.maxLife;
        ctx.globalAlpha = Math.min(1, t * 2.5);
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(14, 6, 36, 0.85)';
        ctx.strokeText(popup.text, popup.x, popup.y);
        ctx.fillStyle = popup.color;
        ctx.fillText(popup.text, popup.x, popup.y);
      }
      ctx.globalAlpha = 1;
    }

    // Draw the grey blocks that fill the board from the bottom on game over.
    function drawGameOverFill(ctx) {
      const filledRows = Math.floor(overProgress);
      for (let i = 0; i < filledRows; i++) {
        const visibleRow = VISIBLE_ROWS - 1 - i;
        for (let col = 0; col < COLS; col++) {
          drawBlock(ctx, col, visibleRow, COLOR_DEAD);
        }
      }
    }

    // Draw the whole playfield: grid, placed blocks, effects, ghost, and the falling piece.
    function drawPlayfield() {
      const ctx = boardCtx;
      ctx.save();
      const offset = shakeOffset();
      ctx.translate(offset.x, offset.y);

      ctx.fillStyle = COLOR_FIELD;
      ctx.fillRect(-20, -20, BOARD_W + 40, BOARD_H + 40);
      drawGridLines(ctx);

      // Only the visible rows are drawn. The 2 hidden rows at the top are skipped.
      for (let row = BUFFER_ROWS; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const type = board[row][col];
          if (type) drawBlock(ctx, col, row - BUFFER_ROWS, COLORS[type]);
        }
      }

      drawFlashRows(ctx);
      drawPulses(ctx);
      if (state === 'over') {
        drawGameOverFill(ctx);
      }
      if (current) {
        drawGhost(ctx);
        drawFallingPiece(ctx);
      }
      drawParticles(ctx);
      drawPopups(ctx);
      ctx.restore();
    }

    // Draw one piece centered on (centerX, centerY) in a preview canvas.
    function drawMiniPiece(ctx, type, centerX, centerY) {
      const cells = SHAPES[type][0];
      const xs = cells.map(([x]) => x);
      const ys = cells.map(([, y]) => y);
      const minX = Math.min(...xs);
      const minY = Math.min(...ys);
      const width = Math.max(...xs) - minX + 1;
      const height = Math.max(...ys) - minY + 1;
      const left = centerX - (width * PREVIEW_CELL) / 2;
      const top = centerY - (height * PREVIEW_CELL) / 2;

      for (const [x, y] of cells) {
        drawTile(
          ctx,
          left + (x - minX) * PREVIEW_CELL,
          top + (y - minY) * PREVIEW_CELL,
          PREVIEW_CELL,
          COLORS[type]
        );
      }
    }

    // Draw the HOLD piece. It looks faded when holding is not allowed right now.
    function drawHold() {
      holdCtx.clearRect(0, 0, HOLD_W, HOLD_H);
      if (holdType === null) return;
      holdCtx.globalAlpha = canHold ? 1 : 0.35;
      drawMiniPiece(holdCtx, holdType, HOLD_W / 2, HOLD_H / 2);
      holdCtx.globalAlpha = 1;
    }

    // Draw the next pieces, one per slot, from top to bottom.
    function drawNext() {
      nextCtx.clearRect(0, 0, NEXT_W, NEXT_H);
      const slotHeight = NEXT_H / NEXT_COUNT;
      for (let i = 0; i < NEXT_COUNT; i++) {
        drawMiniPiece(nextCtx, nextQueue[i], NEXT_W / 2, slotHeight * i + slotHeight / 2);
      }
    }

    // Update SCORE, LEVEL, LINES, BEST and the level progress bar.
    function updateStats() {
      popIfChanged(scoreText, String(score));
      popIfChanged(levelText, String(level));
      popIfChanged(linesText, String(lines));
      popIfChanged(bestText, String(best));
      levelBar.style.width = `${(lines % 10) * 10}%`;
    }

    // Set a stat's text, and animate it only when the value actually changed.
    function popIfChanged(el, text) {
      if (el.textContent !== text) {
        popElement(el, text);
      }
    }

    // ============================================================
    // 15. OVERLAY CARDS (pause, game over)
    // ============================================================

    // Show the card that matches the current state, or hide it while playing.
    function refreshOverlay() {
      if (state === 'paused') {
        showOverlay('PAUSED', 'Take a breather.', 'Press P or Esc to resume', 'Resume', 'pause');
      } else if (state === 'over' && overProgress >= VISIBLE_ROWS) {
        const isNewBest = score > 0 && score > bestAtStart;
        showOverlay(
          'GAME OVER',
          isNewBest ? `New best: ${score}` : `Final score: ${score}`,
          'Press R or Enter to play again',
          'Play again',
          'restart'
        );
      } else {
        hideOverlay();
      }
    }

    // Fill in the card and show it.
    function showOverlay(title, text, hint, buttonLabel, action) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayHint.textContent = hint;
      overlayButton.textContent = buttonLabel;
      overlayButton.hidden = false;
      overlayAction = action;
      overlayEl.classList.remove('hidden');
    }

    // Hide the card.
    function hideOverlay() {
      overlayEl.classList.add('hidden');
      overlayButton.hidden = true;
      overlayAction = null;
    }

    // ============================================================
    // 16. MAIN LOOP
    // ============================================================

    // Draw everything for the current frame.
    function render() {
      drawPlayfield();
      drawHold();
      drawNext();
      updateStats();
    }

    // Runs once per animation frame. Converts real elapsed time into dt seconds.
    function gameLoop(timestamp) {
      if (lastFrameTime === null) {
        lastFrameTime = timestamp;
      }
      // Cap dt so a tab switch does not make the piece jump many rows at once.
      const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
      lastFrameTime = timestamp;

      if (state === 'playing') {
        update(dt);
        updateVisuals(dt);
      }
      if (state !== 'paused') {
        updateEffects(dt);
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // 17. START (the game begins straight away, no title screen)
    // ============================================================

    best = loadBest();
    layoutCanvases();
    window.addEventListener('resize', layoutCanvases);
    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
