<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Buster</title>
  <meta name="description" content="Block Buster is a clean, fast Tetris clone that follows the modern Guideline: 7-bag, SRS rotation, hold, ghost piece, T-spins and back-to-back bonuses.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%2300f0f0'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%23ffd23f'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%23a000f0'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%23f00000'/%3E%3C/svg%3E">
  <style>
    /* ---------- Colors ---------- */
    :root {
      --bg: #0b0d12;
      --field: #0d1017;
      --surface: #141821;
      --surface-raised: #1b2130;
      --line: #252c39;
      --text: #eef2f8;
      --muted: #7d8799;
      --accent: #ffd23f;
      --accent-ink: #14120a;
    }

    /* ---------- Base page ---------- */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 32px;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.34em;
      margin: 0 0 20px 0.34em;
    }
    .brand span { color: var(--accent); }

    /* ---------- Layout: HOLD | board | NEXT and stats ---------- */
    .game {
      display: grid;
      grid-template-columns: 150px auto 170px;
      grid-template-areas: "hold board side";
      gap: 20px;
      align-items: start;
    }
    .hold-panel { grid-area: hold; }
    .board-wrap { grid-area: board; position: relative; justify-self: center; }
    .side { grid-area: side; display: flex; flex-direction: column; gap: 12px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .stat + .stat { margin-top: 14px; }
    .stat-value {
      display: inline-block;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      font-variant-numeric: tabular-nums;
      transform-origin: left center;
    }
    .progress {
      height: 4px;
      margin-top: 8px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    /* ---------- Playfield and previews ---------- */
    #board {
      display: block;
      height: min(78vh, 640px);
      width: auto;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    #holdCanvas, #nextCanvas {
      display: block;
      margin: 0 auto;
    }
    #holdCanvas { width: 120px; height: 90px; }
    #nextCanvas { width: 120px; height: 320px; }

    /* Big "BUST!" callout that pops over the playfield */
    .callout {
      position: absolute;
      left: 50%;
      top: 30%;
      width: 100%;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }
    .callout-main {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.04em;
      margin: 0;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
    .callout-sub {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 8px 0 0;
    }

    /* Start, pause and game-over card drawn over the playfield */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(11, 13, 18, 0.86);
      border-radius: 10px;
      transition: opacity 0.25s ease, visibility 0.25s;
    }
    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .overlay-card { text-align: center; max-width: 280px; }
    .overlay-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.12em;
      margin: 0 0 10px;
    }
    .overlay-title span { color: var(--accent); }
    .overlay-text {
      font-size: 15px;
      margin: 0 0 18px;
      opacity: 0.9;
    }
    .overlay-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 16px 0 0;
    }
    .btn-primary {
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--accent-ink);
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      padding: 12px 30px;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* ---------- Controls help (wide screens) ---------- */
    .help {
      display: none;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      margin: 24px 0 0;
    }

    /* ---------- Touch buttons (small screens only) ---------- */
    .touch { display: none; }
    .touch button {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.08s ease, background 0.08s ease;
    }
    .touch button:active {
      background: var(--surface-raised);
      transform: scale(0.96);
    }

    /* ---------- Small screens (below 600 px wide) ---------- */
    @media (max-width: 599px) {
      body { padding: 16px 16px 24px; }
      .brand h1 { margin-bottom: 14px; }
      .game {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "board board"
          "hold side";
        gap: 12px;
        width: 100%;
        max-width: 420px;
      }
      #board { height: min(64vh, 640px); }
      .callout-main { font-size: 22px; }
      .overlay-title { font-size: 24px; }
      .touch {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 100%;
        max-width: 420px;
        margin-top: 14px;
      }
    }

    @media (min-width: 600px) {
      .help { display: block; }
    }

    /* Respect users who ask for less motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="brand">
    <h1>BLOCK <span>BUSTER</span></h1>
  </header>

  <main class="game">
    <!-- HOLD -->
    <section class="panel hold-panel">
      <h2 class="label">HOLD</h2>
      <canvas id="holdCanvas"></canvas>
    </section>

    <!-- Playfield, callouts and overlay cards -->
    <section class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="callout" class="callout" aria-live="polite">
        <p id="calloutMain" class="callout-main"></p>
        <p id="calloutSub" class="callout-sub"></p>
      </div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <p id="overlayTitle" class="overlay-title"></p>
          <p id="overlayText" class="overlay-text"></p>
          <button id="overlayButton" class="btn-primary" hidden></button>
          <p id="overlayHint" class="overlay-hint"></p>
        </div>
      </div>
    </section>

    <div class="side">
      <!-- NEXT -->
      <section class="panel next-panel">
        <h2 class="label">NEXT</h2>
        <canvas id="nextCanvas"></canvas>
      </section>

      <!-- SCORE, LEVEL, LINES, BEST -->
      <section class="panel stats-panel">
        <div class="stat">
          <h2 class="label">SCORE</h2>
          <p id="score" class="stat-value">0</p>
        </div>
        <div class="stat">
          <h2 class="label">LEVEL</h2>
          <p id="level" class="stat-value">1</p>
          <div class="progress"><span id="levelBar"></span></div>
        </div>
        <div class="stat">
          <h2 class="label">LINES</h2>
          <p id="lines" class="stat-value">0</p>
        </div>
        <div class="stat">
          <h2 class="label">BEST</h2>
          <p id="best" class="stat-value">0</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Touch buttons (shown below 600 px) -->
  <div id="touchControls" class="touch">
    <button data-action="left">Left</button>
    <button data-action="right">Right</button>
    <button data-action="down">Down</button>
    <button data-action="rotateCW">Rotate</button>
    <button data-action="rotateCCW">Rotate CCW</button>
    <button data-action="hardDrop">Drop</button>
    <button data-action="hold">Hold</button>
    <button data-action="pause">Pause</button>
    <button data-action="restart">Restart</button>
  </div>

  <!-- Keyboard help (shown on wide screens) -->
  <p class="help">
    ← → move · ↓ soft drop · ↑ or X rotate clockwise · Z rotate counterclockwise<br>
    Space hard drop · C or Shift hold · P or Esc pause · R restart
  </p>

  <script>
    // ============================================================
    // 1. SETTINGS AND CONSTANTS
    // ============================================================

    // Board size: 10 columns, 20 visible rows, and 2 hidden rows above them for spawning.
    const COLS = 10;
    const VISIBLE_ROWS = 20;
    const BUFFER_ROWS = 2;
    const ROWS = VISIBLE_ROWS + BUFFER_ROWS;

    // Spawn position. The piece's box starts at column 3 and row 1,
    // so the bottom of every piece lands on the top visible row (row 2).
    const SPAWN_X = 3;
    const SPAWN_Y = 1;

    // Drawing sizes, in logical pixels. The canvases are scaled to the screen for sharp output.
    const CELL = 30;                 // one block on the playfield
    const BOARD_W = COLS * CELL;
    const BOARD_H = VISIBLE_ROWS * CELL;
    const PREVIEW_CELL = 14;         // one block in HOLD and NEXT
    const HOLD_W = 120;
    const HOLD_H = 90;
    const NEXT_W = 120;
    const NEXT_H = 320;
    const NEXT_COUNT = 5;            // how many upcoming pieces to show

    // Timing, in seconds.
    const LOCK_DELAY = 0.5;
    const MAX_LOCK_RESETS = 15;
    const DAS = 0.167;               // delay before a held left/right starts repeating
    const ARR = 0.033;               // time between repeated moves
    const SOFT_DROP_INTERVAL = 0.05; // time per row while Down is held
    const CLEAR_FLASH_TIME = 0.25;   // how long cleared rows flash before they disappear
    const LOCK_PULSE_TIME = 0.2;     // white flash on blocks as they lock
    const SHAKE_TIME = 0.35;         // how long the screen shakes after a bust

    // Animation tuning.
    const VISUAL_SMOOTHING = 26;     // higher = the falling piece catches up to its real spot faster
    const PARTICLE_GRAVITY = 900;    // pixels per second squared
    const MAX_PARTICLES = 260;
    const GAME_OVER_ROWS_PER_SECOND = 18;
    const SHAKE_BY_CLEAR = [0, 1.5, 3, 4.5, 7];  // shake strength for 0-4 rows cleared

    // Respect the operating system's "reduce motion" setting: no shake, particles or sliding.
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Colors. The seven piece colors are the standard Guideline colors.
    const COLORS = {
      I: '#00f0f0',
      O: '#f0f000',
      T: '#a000f0',
      S: '#00f000',
      Z: '#f00000',
      J: '#0000f0',
      L: '#f0a000',
    };
    const COLOR_FIELD = '#0d1017';
    const COLOR_GRID = '#171c26';
    const COLOR_FLASH = 'rgba(255, 255, 255, 0.55)';
    const COLOR_DEAD = '#2a3140';    // grey blocks that fill the board on game over

    const PIECE_NAMES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
    const CLEAR_NAMES = ['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS'];
    const BEST_KEY = 'blockBusterBest';

    // Piece shapes. Each piece has 4 rotation states:
    // 0 = spawn, 1 = clockwise, 2 = 180 degrees, 3 = counterclockwise.
    // Each state lists the [x, y] offsets of the 4 blocks inside the piece's box (y goes down).
    const SHAPES = {
      I: [
        [[0, 1], [1, 1], [2, 1], [3, 1]],
        [[2, 0], [2, 1], [2, 2], [2, 3]],
        [[0, 2], [1, 2], [2, 2], [3, 2]],
        [[1, 0], [1, 1], [1, 2], [1, 3]],
      ],
      O: [
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
      ],
      T: [
        [[1, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [1, 1], [2, 1], [1, 2]],
        [[0, 1], [1, 1], [2, 1], [1, 2]],
        [[1, 0], [0, 1], [1, 1], [1, 2]],
      ],
      J: [
        [[0, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [1, 2]],
        [[0, 1], [1, 1], [2, 1], [2, 2]],
        [[1, 0], [1, 1], [0, 2], [1, 2]],
      ],
      L: [
        [[2, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [1, 1], [1, 2], [2, 2]],
        [[0, 1], [1, 1], [2, 1], [0, 2]],
        [[0, 0], [1, 0], [1, 1], [1, 2]],
      ],
      S: [
        [[1, 0], [2, 0], [0, 1], [1, 1]],
        [[1, 0], [1, 1], [2, 1], [2, 2]],
        [[1, 1], [2, 1], [0, 2], [1, 2]],
        [[0, 0], [0, 1], [1, 1], [1, 2]],
      ],
      Z: [
        [[0, 0], [1, 0], [1, 1], [2, 1]],
        [[2, 0], [1, 1], [2, 1], [1, 2]],
        [[0, 1], [1, 1], [1, 2], [2, 2]],
        [[1, 0], [0, 1], [1, 1], [0, 2]],
      ],
    };

    // SRS wall kick tests for J, L, S, T, Z.
    // Each entry is [x, y] with y pointing UP (the Tetris Wiki convention).
    // The key is "from>to", where the numbers are rotation states.
    const KICKS_JLSTZ = {
      '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
      '1>0': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      '2>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
      '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
      '3>2': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
      '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
      '0>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    };

    // SRS wall kick tests for I (same format as above).
    const KICKS_I = {
      '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      '1>0': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
      '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
      '2>1': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
      '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
      '3>2': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
      '0>3': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    };

    // Keyboard codes mapped to game actions.
    const KEY_ACTIONS = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowDown: 'down',
      ArrowUp: 'rotateCW',
      KeyX: 'rotateCW',
      KeyZ: 'rotateCCW',
      Space: 'hardDrop',
      KeyC: 'hold',
      ShiftLeft: 'hold',
      ShiftRight: 'hold',
      KeyP: 'pause',
      Escape: 'pause',
      KeyR: 'restart',
      Enter: 'confirm',
      NumpadEnter: 'confirm',
    };

    // ============================================================
    // 2. GAME STATE
    // ============================================================

    let board = [];            // ROWS rows of COLS cells; each cell is null or a piece letter
    let current = null;        // the falling piece: { type, rot, x, y }
    let holdType = null;       // piece letter in the HOLD slot
    let canHold = true;        // false after a hold until the next lock
    let pieceBag = [];         // remaining pieces in the current 7-bag
    let nextQueue = [];        // upcoming piece letters, shown in NEXT
    let score = 0;
    let level = 1;
    let lines = 0;
    let best = 0;
    let bestAtStart = 0;       // the best score when this game began (for "New best!")
    let lastClearWasHard = false; // was the previous line clear a Tetris or T-spin? (for back-to-back)
    let state = 'ready';       // 'ready' (title card), 'playing', 'paused', or 'over'
    let flashRows = [];        // rows currently flashing after a line clear
    let flashTimer = 0;
    let gravityTimer = 0;
    let lockTimer = 0;
    let lockResets = 0;
    let lastMoveWasRotation = false; // used for T-spin detection
    let lastKick = -1;         // which wall kick test the last rotation used (-1 = rotation failed)
    let moveDir = 0;           // -1 left, 1 right, 0 none (held direction for auto-shift)
    let moveTimer = 0;
    let dasDone = false;       // has the DAS delay finished for the held direction?
    let softDropping = false;  // is Down held?
    let softTimer = 0;
    let lastFrameTime = null;

    // Visual-only state (animations). None of this affects the rules.
    let visual = { x: SPAWN_X, y: SPAWN_Y };   // smoothed on-screen spot of the falling piece
    let particles = [];        // small squares that burst out of cleared rows
    let pulses = [];           // white flashes on blocks that just locked
    let shake = { time: 0, duration: SHAKE_TIME, amount: 0 };
    let overProgress = 0;      // rows of grey filled in during the game-over animation
    let overlayAction = null;  // what the overlay button does right now
    let calloutTimer = null;

    // Page elements we update often.
    const boardCanvas = document.getElementById('board');
    const holdCanvas = document.getElementById('holdCanvas');
    const nextCanvas = document.getElementById('nextCanvas');
    let boardCtx = null;       // set by layoutCanvases()
    let holdCtx = null;
    let nextCtx = null;
    const scoreText = document.getElementById('score');
    const levelText = document.getElementById('level');
    const linesText = document.getElementById('lines');
    const bestText = document.getElementById('best');
    const levelBar = document.getElementById('levelBar');
    const calloutEl = document.getElementById('callout');
    const calloutMain = document.getElementById('calloutMain');
    const calloutSub = document.getElementById('calloutSub');
    const overlayEl = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const overlayHint = document.getElementById('overlayHint');
    const overlayButton = document.getElementById('overlayButton');

    // ============================================================
    // 3. BOARD AND PIECE HELPERS
    // ============================================================

    // Make one empty row of the board.
    function makeEmptyRow() {
      return new Array(COLS).fill(null);
    }

    // Make an empty board with ROWS rows.
    function makeEmptyBoard() {
      const newBoard = [];
      for (let row = 0; row < ROWS; row++) {
        newBoard.push(makeEmptyRow());
      }
      return newBoard;
    }

    // Return the board positions a piece occupies.
    function getCells(piece) {
      return SHAPES[piece.type][piece.rot].map(([dx, dy]) => ({
        x: piece.x + dx,
        y: piece.y + dy,
      }));
    }

    // Return true if the piece fits: inside the walls and floor, and not overlapping any block.
    function fits(piece) {
      return getCells(piece).every((cell) =>
        cell.x >= 0 && cell.x < COLS &&
        cell.y >= 0 && cell.y < ROWS &&
        board[cell.y][cell.x] === null
      );
    }

    // A spot counts as blocked if it is a wall, the floor, or a locked block. Used for T-spin checks.
    function isBlocked(x, y) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
      return board[y][x] !== null;
    }

    // Return true if the piece cannot move down one row.
    function isGrounded() {
      return !fits({ ...current, y: current.y + 1 });
    }

    // Find the row where the current piece would land if dropped straight down (the ghost).
    function ghostY() {
      let landY = current.y;
      while (fits({ ...current, y: landY + 1 })) {
        landY++;
      }
      return landY;
    }

    // ============================================================
    // 4. RANDOMIZER (7-BAG)
    // ============================================================

    // Shuffle an array in place (Fisher-Yates).
    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    // Take one piece from the bag. When the bag is empty, shuffle all 7 pieces into a new bag.
    function takeFromBag() {
      if (pieceBag.length === 0) {
        pieceBag = shuffle([...PIECE_NAMES]);
      }
      return pieceBag.pop();
    }

    // Keep the NEXT queue full so the preview always has enough pieces.
    function fillNextQueue() {
      while (nextQueue.length < NEXT_COUNT) {
        nextQueue.push(takeFromBag());
      }
    }

    // Take the next piece for play and refill the queue.
    function takeNextType() {
      const type = nextQueue.shift();
      fillNextQueue();
      return type;
    }

    // ============================================================
    // 5. GRAVITY
    // ============================================================

    // Seconds for a piece to fall one row at this level.
    function gravityInterval(lvl) {
      return Math.pow(0.8 - (lvl - 1) * 0.007, lvl - 1);
    }

    // ============================================================
    // 6. MOVING AND ROTATING
    // ============================================================

    // Move the piece by (dx, dy) if there is room. Used by gravity and soft drop. Does not reset lock delay.
    function shiftPiece(dx, dy) {
      if (!fits({ ...current, x: current.x + dx, y: current.y + dy })) {
        return false;
      }
      current.x += dx;
      current.y += dy;
      lastMoveWasRotation = false;
      return true;
    }

    // Move the piece because the player pressed a key. A successful move can reset the lock delay.
    function playerMove(dx, dy) {
      if (!shiftPiece(dx, dy)) {
        return false;
      }
      resetLockTimerIfGrounded();
      return true;
    }

    // After a successful move or rotation while grounded, restart the lock timer.
    // This only happens up to MAX_LOCK_RESETS times per piece.
    function resetLockTimerIfGrounded() {
      if (!isGrounded()) {
        lockTimer = 0;
        return;
      }
      if (lockResets < MAX_LOCK_RESETS) {
        lockTimer = 0;
        lockResets++;
      }
    }

    // Rotate the piece clockwise (dir = 1) or counterclockwise (dir = -1) using SRS wall kicks.
    function rotatePiece(dir) {
      lastKick = -1;
      if (current.type === 'O') {
        return false; // the O piece does not rotate visibly
      }

      const newRot = (current.rot + (dir === 1 ? 1 : 3)) % 4;
      const kickKey = `${current.rot}>${newRot}`;
      const kickTests = current.type === 'I' ? KICKS_I[kickKey] : KICKS_JLSTZ[kickKey];

      // Try each kick in order. The first one that fits wins.
      for (let i = 0; i < kickTests.length; i++) {
        const [dx, dy] = kickTests[i];
        const candidate = { type: current.type, rot: newRot, x: current.x + dx, y: current.y - dy };
        if (fits(candidate)) {
          current.rot = candidate.rot;
          current.x = candidate.x;
          current.y = candidate.y;
          lastKick = i;
          lastMoveWasRotation = true;
          resetLockTimerIfGrounded();
          return true;
        }
      }
      return false;
    }

    // ============================================================
    // 7. PER-FRAME GAME UPDATES
    // ============================================================

    // Auto-shift: after DAS, a held left or right moves once every ARR.
    function updateAutoShift(dt) {
      if (moveDir === 0) return;
      moveTimer += dt;
      if (!dasDone) {
        if (moveTimer < DAS) return;
        dasDone = true;
        moveTimer -= DAS;
      }
      while (moveTimer >= ARR) {
        moveTimer -= ARR;
        if (!playerMove(moveDir, 0)) {
          moveTimer = 0;
          break;
        }
      }
    }

    // Soft drop: while Down is held, move one row every SOFT_DROP_INTERVAL. Each row is worth 1 point.
    function updateSoftDrop(dt) {
      if (!softDropping) return;
      softTimer += dt;
      while (softTimer >= SOFT_DROP_INTERVAL) {
        softTimer -= SOFT_DROP_INTERVAL;
        if (!shiftPiece(0, 1)) {
          softTimer = 0;
          break;
        }
        addScore(1);
      }
    }

    // Gravity: the piece falls one row every gravityInterval(level) seconds.
    function updateGravity(dt) {
      gravityTimer += dt;
      const interval = gravityInterval(level);
      let rowsFallen = 0;
      while (gravityTimer >= interval && rowsFallen < ROWS) {
        gravityTimer -= interval;
        rowsFallen++;
        if (!shiftPiece(0, 1)) {
          gravityTimer = 0;
          break;
        }
      }
    }

    // Lock delay: a grounded piece locks after LOCK_DELAY seconds.
    function updateLockDelay(dt) {
      if (!isGrounded()) {
        lockTimer = 0;
        return;
      }
      lockTimer += dt;
      if (lockTimer >= LOCK_DELAY) {
        lockPiece();
      }
    }

    // Advance the game by dt seconds.
    function update(dt) {
      // During a line-clear flash nothing moves. When the flash ends, the rows are removed.
      if (flashRows.length > 0) {
        flashTimer -= dt;
        if (flashTimer <= 0) {
          finishLineClear();
        }
        return;
      }
      if (!current) return;

      updateAutoShift(dt);
      updateSoftDrop(dt);
      updateGravity(dt);
      updateLockDelay(dt);
    }

    // ============================================================
    // 8. SPAWNING, HOLD AND HARD DROP
    // ============================================================

    // Put a new piece of this type at the top of the board. If it does not fit, the game is over.
    function placeNewPiece(type) {
      current = { type, rot: 0, x: SPAWN_X, y: SPAWN_Y };
      visual = { x: current.x, y: current.y };
      lockTimer = 0;
      lockResets = 0;
      gravityTimer = 0;
      lastMoveWasRotation = false;
      if (!fits(current)) {
        endGame();
      }
    }

    // Spawn the next piece from the queue.
    function spawnPiece() {
      placeNewPiece(takeNextType());
    }

    // Swap the current piece with the HOLD slot. Allowed once per piece; canHold comes back on lock.
    function holdCurrentPiece() {
      if (!canHold || !current) return false;

      const pieceToHold = current.type;
      if (holdType === null) {
        holdType = pieceToHold;
        spawnPiece();
      } else {
        const pieceToPlay = holdType;
        holdType = pieceToHold;
        placeNewPiece(pieceToPlay);
      }
      canHold = false;
      return true;
    }

    // Drop the piece straight to its landing row (2 points per row), then lock it right away.
    function hardDrop() {
      const distance = ghostY() - current.y;
      if (distance > 0) {
        lastMoveWasRotation = false;
        startShake(1);
      }
      current.y += distance;
      addScore(distance * 2);
      lockPiece();
    }

    // ============================================================
    // 9. LOCKING, LINE CLEARS AND SCORING
    // ============================================================

    // T-spin check (3-corner rule): the last move was a rotation, and at least
    // 3 of the 4 corners around the T's center are blocked.
    function isTSpin() {
      if (current.type !== 'T' || !lastMoveWasRotation) return false;

      // The T's box is 3x3, so its center is at offset (1, 1).
      const centerX = current.x + 1;
      const centerY = current.y + 1;
      const corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
      const blockedCount = corners.filter(([dx, dy]) =>
        isBlocked(centerX + dx, centerY + dy)
      ).length;
      return blockedCount >= 3;
    }

    // Return the row numbers that are completely filled.
    function findFullRows() {
      const fullRows = [];
      for (let y = 0; y < ROWS; y++) {
        if (board[y].every((cell) => cell !== null)) {
          fullRows.push(y);
        }
      }
      return fullRows;
    }

    // Lock the falling piece into the board, score any cleared lines, then spawn the next piece.
    function lockPiece() {
      const tSpin = isTSpin();
      const lockedCells = getCells(current);
      for (const cell of lockedCells) {
        board[cell.y][cell.x] = current.type;
      }
      addLockPulses(lockedCells);
      current = null;
      canHold = true;

      const fullRows = findFullRows();
      if (fullRows.length > 0) {
        const award = awardLines(fullRows.length, tSpin);
        flashRows = fullRows;
        flashTimer = CLEAR_FLASH_TIME;
        spawnClearBurst(fullRows);
        celebrateClear(award);
      } else {
        if (tSpin) {
          const points = 400 * level; // T-spin with no lines cleared
          addScore(points);
          showCallout('T-SPIN', `+${points}`);
        }
        spawnPiece();
      }
    }

    // Score a line clear and update lines and level. Returns what happened so the celebration can match it.
    // Normal: single 100, double 300, triple 500, Tetris 800 (times level).
    // T-spin: single 800, double 1200, triple 1600 (times level).
    // Back-to-back Tetris or T-spin clears get 1.5x.
    function awardLines(count, tSpin) {
      const isHard = count === 4 || tSpin;
      let points = tSpin
        ? [800, 1200, 1600][count - 1]
        : [100, 300, 500, 800][count - 1];
      points *= level;

      const backToBack = isHard && lastClearWasHard;
      if (backToBack) {
        points = Math.floor(points * 1.5);
      }
      addScore(points);
      lastClearWasHard = isHard;

      const oldLevel = level;
      lines += count;
      level = Math.floor(lines / 10) + 1;
      return { count, tSpin, points, backToBack, leveledUp: level > oldLevel, levelNow: level };
    }

    // Add points to the score, and update BEST if the score beats it.
    function addScore(points) {
      score += points;
      if (score > best) {
        best = score;
        saveBest();
      }
    }

    // After the flash, remove the cleared rows and add empty rows at the top.
    function finishLineClear() {
      board = board.filter((row, y) => !flashRows.includes(y));
      while (board.length < ROWS) {
        board.unshift(makeEmptyRow());
      }
      flashRows = [];
      spawnPiece();
    }

    // ============================================================
    // 10. GAME FLOW (start, restart, pause, game over)
    // ============================================================

    // Reset everything about the game except the falling piece.
    function prepareNewGame() {
      board = makeEmptyBoard();
      pieceBag = [];
      nextQueue = [];
      fillNextQueue();
      holdType = null;
      canHold = true;
      score = 0;
      level = 1;
      lines = 0;
      lastClearWasHard = false;
      bestAtStart = best;
      flashRows = [];
      flashTimer = 0;
      moveDir = 0;
      softDropping = false;
      particles = [];
      pulses = [];
      shake.amount = 0;
      shake.time = shake.duration;
      overProgress = 0;
      hideCallout();
    }

    // Start a new game from scratch.
    function resetGame() {
      prepareNewGame();
      state = 'playing';
      spawnPiece();
      refreshOverlay();
    }

    // Stop the game. The board fills with grey, then the game-over card appears.
    function endGame() {
      state = 'over';
      current = null;
      moveDir = 0;
      softDropping = false;
      overProgress = REDUCED_MOTION ? ROWS : 0;
      refreshOverlay();
    }

    // Pause or resume. Does nothing unless the game is running or paused.
    function togglePause() {
      if (state === 'playing') {
        state = 'paused';
      } else if (state === 'paused') {
        state = 'playing';
      } else {
        return;
      }
      moveDir = 0;
      softDropping = false;
      refreshOverlay();
    }

    // ============================================================
    // 11. HIGH SCORE SAVING
    // ============================================================

    // Read the saved high score. If storage is blocked, use 0.
    function loadBest() {
      try {
        return Number(localStorage.getItem(BEST_KEY)) || 0;
      } catch (err) {
        return 0;
      }
    }

    // Save the high score. If storage is blocked, the score just is not saved.
    function saveBest() {
      try {
        localStorage.setItem(BEST_KEY, String(best));
      } catch (err) {
        // ignore: storage is not available
      }
    }

    // ============================================================
    // 12. INPUT (keyboard, touch and overlay buttons all use these)
    // ============================================================

    // Start an action. Left, right and down keep going while held; the others happen once.
    function pressAction(action) {
      // Title card: any start key begins a game.
      if (state === 'ready') {
        if (['start', 'confirm', 'hardDrop', 'restart'].includes(action)) resetGame();
        return;
      }
      // Game over: only explicit restart keys work, so a stray Space does not wipe the score.
      if (state === 'over') {
        if (action === 'confirm' || action === 'restart') resetGame();
        return;
      }
      // Paused: only resume and restart work.
      if (state === 'paused') {
        if (action === 'pause' || action === 'confirm') togglePause();
        else if (action === 'restart') resetGame();
        return;
      }

      // Playing.
      if (action === 'pause') {
        togglePause();
        return;
      }
      if (action === 'restart') {
        resetGame();
        return;
      }
      if (!current) return;

      if (action === 'left') startAutoShift(-1);
      else if (action === 'right') startAutoShift(1);
      else if (action === 'down') {
        softDropping = true;
        softTimer = SOFT_DROP_INTERVAL; // first row falls right away
      }
      else if (action === 'rotateCW') rotatePiece(1);
      else if (action === 'rotateCCW') rotatePiece(-1);
      else if (action === 'hardDrop') hardDrop();
      else if (action === 'hold') holdCurrentPiece();
    }

    // Stop a held action (only left, right and down need this).
    function releaseAction(action) {
      if (action === 'left' && moveDir === -1) moveDir = 0;
      if (action === 'right' && moveDir === 1) moveDir = 0;
      if (action === 'down') softDropping = false;
    }

    // Move once right away, then repeat after DAS.
    function startAutoShift(dir) {
      playerMove(dir, 0);
      moveDir = dir;
      moveTimer = 0;
      dasDone = false;
    }

    // Keyboard: pressing a key starts its action; releasing it stops a held action.
    document.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      const action = KEY_ACTIONS[event.code];
      if (!action) return;
      event.preventDefault();
      if (event.repeat) return; // ignore OS key repeat; left, right and down repeat with our own timers
      pressAction(action);
    });

    document.addEventListener('keyup', (event) => {
      const action = KEY_ACTIONS[event.code];
      if (action) releaseAction(action);
    });

    // Touch buttons: press starts the action, releasing stops held actions.
    document.querySelectorAll('#touchControls button').forEach((button) => {
      const action = button.dataset.action;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        pressAction(action);
      });
      button.addEventListener('pointerup', () => releaseAction(action));
      button.addEventListener('pointerleave', () => releaseAction(action));
      button.addEventListener('pointercancel', () => releaseAction(action));
      button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    // The card's button (Play, Resume, Play again). Blur afterwards so Space cannot press it again.
    overlayButton.addEventListener('click', () => {
      overlayButton.blur();
      if (overlayAction) pressAction(overlayAction);
    });

    // ============================================================
    // 13. ANIMATION: SMOOTH MOTION, PARTICLES, SHAKE, CALLOUTS
    // ============================================================

    // Ease the falling piece toward its real position so sideways moves and drops glide.
    function updateVisuals(dt) {
      if (!current) return;
      if (REDUCED_MOTION) {
        visual = { x: current.x, y: current.y };
        return;
      }
      const amount = 1 - Math.exp(-VISUAL_SMOOTHING * dt);
      visual.x += (current.x - visual.x) * amount;
      visual.y += (current.y - visual.y) * amount;
      if (Math.abs(current.x - visual.x) < 0.01) visual.x = current.x;
      if (Math.abs(current.y - visual.y) < 0.01) visual.y = current.y;
    }

    // Advance particles, lock pulses, screen shake and the game-over fill.
    // This runs in real time, so the effects keep playing during the flash.
    function updateEffects(dt) {
      shake.time += dt;

      for (const p of particles) {
        p.vy += PARTICLE_GRAVITY * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      }
      particles = particles.filter((p) => p.life > 0);

      for (const pulse of pulses) {
        pulse.life -= dt;
      }
      pulses = pulses.filter((pulse) => pulse.life > 0);

      if (state === 'over' && overProgress < VISIBLE_ROWS) {
        overProgress = Math.min(VISIBLE_ROWS, overProgress + dt * GAME_OVER_ROWS_PER_SECOND);
        if (overProgress >= VISIBLE_ROWS) {
          refreshOverlay();
        }
      }
    }

    // Start a screen shake. The shake fades out over SHAKE_TIME.
    function startShake(strength) {
      if (REDUCED_MOTION) return;
      shake.amount = Math.max(strength, shake.time < shake.duration ? shake.amount : 0);
      shake.time = 0;
      shake.duration = SHAKE_TIME;
    }

    // Current shake offset in logical pixels. Zero when no shake is running.
    function shakeOffset() {
      if (shake.time >= shake.duration) return { x: 0, y: 0 };
      const strength = shake.amount * (1 - shake.time / shake.duration);
      return {
        x: (Math.random() * 2 - 1) * strength,
        y: (Math.random() * 2 - 1) * strength,
      };
    }

    // Make a block that flashes white for a moment when it locks in place.
    function addLockPulses(cells) {
      if (REDUCED_MOTION) return;
      for (const cell of cells) {
        if (cell.y < BUFFER_ROWS) continue;
        pulses.push({ col: cell.x, visibleRow: cell.y - BUFFER_ROWS, life: LOCK_PULSE_TIME });
      }
    }

    // Make one particle at (x, y) that flies outward and fades.
    function makeParticle(x, y, color) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 220;
      const life = 0.45 + Math.random() * 0.4;
      return {
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 60,
        life,
        maxLife: life,
        color,
        size: 3 + Math.random() * 3,
      };
    }

    // Burst particles from every block in the cleared rows (two per block, capped overall).
    function spawnClearBurst(rows) {
      if (REDUCED_MOTION) return;
      for (const row of rows) {
        if (row < BUFFER_ROWS) continue;
        for (let col = 0; col < COLS; col++) {
          const type = board[row][col];
          if (!type) continue;
          const x = col * CELL + CELL / 2;
          const y = (row - BUFFER_ROWS) * CELL + CELL / 2;
          for (let i = 0; i < 2 && particles.length < MAX_PARTICLES; i++) {
            particles.push(makeParticle(x, y, COLORS[type]));
          }
        }
      }
    }

    // Show the big "BUST!" text, shake the screen, and buzz on phones for a line clear.
    function celebrateClear(award) {
      let main = 'BUST!';
      if (award.tSpin) main = 'T-SPIN BUST!';
      else if (award.count === 4) main = 'TETRIS BUST!';
      else if (award.count === 3) main = 'TRIPLE BUST!';
      else if (award.count === 2) main = 'DOUBLE BUST!';

      const parts = [`+${award.points}`];
      if (award.backToBack) parts.push('Back-to-back');
      if (award.leveledUp) parts.push(`Level ${award.levelNow}`);
      showCallout(main, parts.join('  ·  '));

      startShake(SHAKE_BY_CLEAR[award.count]);
      if (navigator.vibrate) {
        navigator.vibrate(award.count * 25);
      }
    }

    // Show the callout text with a quick pop-in, hold, then fade out.
    function showCallout(main, sub) {
      calloutMain.textContent = main;
      calloutSub.textContent = sub;
      if (REDUCED_MOTION) {
        calloutEl.style.opacity = '1';
        clearTimeout(calloutTimer);
        calloutTimer = setTimeout(hideCallout, 1200);
        return;
      }
      calloutEl.animate([
        { opacity: 0, transform: 'translate(-50%, -50%) scale(1.45)' },
        { opacity: 1, transform: 'translate(-50%, -50%) scale(1)', offset: 0.16 },
        { opacity: 1, transform: 'translate(-50%, -50%) scale(1)', offset: 0.7 },
        { opacity: 0, transform: 'translate(-50%, -62%) scale(1)' },
      ], { duration: 1200, easing: 'ease-out' });
    }

    // Hide the callout straight away (used when a new game starts).
    function hideCallout() {
      clearTimeout(calloutTimer);
      calloutEl.style.opacity = '0';
    }

    // Briefly bump a number when it changes.
    function popElement(el, text) {
      const hadValue = el.textContent !== '';
      el.textContent = text;
      if (hadValue && !REDUCED_MOTION) {
        el.animate([
          { transform: 'scale(1.22)' },
          { transform: 'scale(1)' },
        ], { duration: 240, easing: 'ease-out' });
      }
    }

    // ============================================================
    // 14. DRAWING
    // ============================================================

    // Size a canvas to its on-screen size (times the screen density) so it looks sharp.
    // Drawing code keeps using the logical sizes (BOARD_W, HOLD_W, ...).
    function fitCanvas(canvas, logicalW, logicalH) {
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(canvas.clientWidth * dpr));
      canvas.height = Math.max(1, Math.round(canvas.clientHeight * dpr));
      ctx.setTransform(canvas.width / logicalW, 0, 0, canvas.height / logicalH, 0, 0);
      return ctx;
    }

    // Set up all three canvases. Called at start and whenever the window size changes.
    function layoutCanvases() {
      boardCtx = fitCanvas(boardCanvas, BOARD_W, BOARD_H);
      holdCtx = fitCanvas(holdCanvas, HOLD_W, HOLD_H);
      nextCtx = fitCanvas(nextCanvas, NEXT_W, NEXT_H);
    }

    // Draw one tile: a flat color with a thin light top edge and a dark bottom edge.
    function drawTile(ctx, x, y, size, color) {
      const edge = Math.max(2, Math.round(size * 0.1));
      ctx.fillStyle = color;
      ctx.fillRect(x + 1, y + 1, size - 2, size - 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(x + 1, y + 1, size - 2, edge);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(x + 1, y + size - 1 - edge, size - 2, edge);
    }

    // Draw one block on the playfield. visibleRow counts from the top of the visible area.
    function drawBlock(ctx, col, visibleRow, color) {
      drawTile(ctx, col * CELL, visibleRow * CELL, CELL, color);
    }

    // Draw the thin grid lines behind the playfield.
    function drawGridLines(ctx) {
      ctx.strokeStyle = COLOR_GRID;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let col = 1; col < COLS; col++) {
        const x = col * CELL + 0.5;
        ctx.moveTo(x, 0);
        ctx.lineTo(x, BOARD_H);
      }
      for (let row = 1; row < VISIBLE_ROWS; row++) {
        const y = row * CELL + 0.5;
        ctx.moveTo(0, y);
        ctx.lineTo(BOARD_W, y);
      }
      ctx.stroke();
    }

    // Draw a faint outline where the current piece would land.
    function drawGhost(ctx) {
      const landY = ghostY();
      ctx.strokeStyle = COLORS[current.type];
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 2;
      for (const cell of getCells({ ...current, y: landY })) {
        if (cell.y < BUFFER_ROWS) continue;
        ctx.strokeRect(
          cell.x * CELL + 2,
          (cell.y - BUFFER_ROWS) * CELL + 2,
          CELL - 4,
          CELL - 4
        );
      }
      ctx.globalAlpha = 1;
    }

    // Draw the falling piece at its smoothed position.
    function drawFallingPiece(ctx) {
      for (const cell of getCells({ ...current, x: visual.x, y: visual.y })) {
        if (cell.y >= BUFFER_ROWS) {
          drawBlock(ctx, cell.x, cell.y - BUFFER_ROWS, COLORS[current.type]);
        }
      }
    }

    // Draw a light wash over the rows that are about to be removed.
    function drawFlashRows(ctx) {
      ctx.fillStyle = COLOR_FLASH;
      for (const row of flashRows) {
        if (row < BUFFER_ROWS) continue;
        ctx.fillRect(0, (row - BUFFER_ROWS) * CELL, BOARD_W, CELL);
      }
    }

    // Draw the fading white flashes on freshly locked blocks.
    function drawPulses(ctx) {
      for (const pulse of pulses) {
        const alpha = 0.5 * (pulse.life / LOCK_PULSE_TIME);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
        ctx.fillRect(pulse.col * CELL + 1, pulse.visibleRow * CELL + 1, CELL - 2, CELL - 2);
      }
    }

    // Draw the particles from cleared rows.
    function drawParticles(ctx) {
      for (const p of particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        const size = p.size * (0.4 + 0.6 * alpha);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
      }
      ctx.globalAlpha = 1;
    }

    // Draw the grey blocks that fill the board from the bottom on game over.
    function drawGameOverFill(ctx) {
      const filledRows = Math.floor(overProgress);
      for (let i = 0; i < filledRows; i++) {
        const visibleRow = VISIBLE_ROWS - 1 - i;
        for (let col = 0; col < COLS; col++) {
          drawBlock(ctx, col, visibleRow, COLOR_DEAD);
        }
      }
    }

    // Draw the whole playfield: grid, placed blocks, effects, ghost, and the falling piece.
    function drawPlayfield() {
      const ctx = boardCtx;
      ctx.save();
      const offset = shakeOffset();
      ctx.translate(offset.x, offset.y);

      ctx.fillStyle = COLOR_FIELD;
      ctx.fillRect(-20, -20, BOARD_W + 40, BOARD_H + 40);
      drawGridLines(ctx);

      // Only the visible rows are drawn. The 2 hidden rows at the top are skipped.
      for (let row = BUFFER_ROWS; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const type = board[row][col];
          if (type) drawBlock(ctx, col, row - BUFFER_ROWS, COLORS[type]);
        }
      }

      drawFlashRows(ctx);
      drawPulses(ctx);
      if (state === 'over') {
        drawGameOverFill(ctx);
      }
      if (current) {
        drawGhost(ctx);
        drawFallingPiece(ctx);
      }
      drawParticles(ctx);
      ctx.restore();
    }

    // Draw one piece centered on (centerX, centerY) in a preview canvas.
    function drawMiniPiece(ctx, type, centerX, centerY) {
      const cells = SHAPES[type][0];
      const xs = cells.map(([x]) => x);
      const ys = cells.map(([, y]) => y);
      const minX = Math.min(...xs);
      const minY = Math.min(...ys);
      const width = Math.max(...xs) - minX + 1;
      const height = Math.max(...ys) - minY + 1;
      const left = centerX - (width * PREVIEW_CELL) / 2;
      const top = centerY - (height * PREVIEW_CELL) / 2;

      for (const [x, y] of cells) {
        drawTile(
          ctx,
          left + (x - minX) * PREVIEW_CELL,
          top + (y - minY) * PREVIEW_CELL,
          PREVIEW_CELL,
          COLORS[type]
        );
      }
    }

    // Draw the HOLD piece. It looks faded when holding is not allowed right now.
    function drawHold() {
      holdCtx.clearRect(0, 0, HOLD_W, HOLD_H);
      if (holdType === null) return;
      holdCtx.globalAlpha = canHold ? 1 : 0.35;
      drawMiniPiece(holdCtx, holdType, HOLD_W / 2, HOLD_H / 2);
      holdCtx.globalAlpha = 1;
    }

    // Draw the next pieces, one per slot, from top to bottom.
    function drawNext() {
      nextCtx.clearRect(0, 0, NEXT_W, NEXT_H);
      const slotHeight = NEXT_H / NEXT_COUNT;
      for (let i = 0; i < NEXT_COUNT; i++) {
        drawMiniPiece(nextCtx, nextQueue[i], NEXT_W / 2, slotHeight * i + slotHeight / 2);
      }
    }

    // Update SCORE, LEVEL, LINES, BEST and the level progress bar.
    function updateStats() {
      popIfChanged(scoreText, String(score));
      popIfChanged(levelText, String(level));
      popIfChanged(linesText, String(lines));
      popIfChanged(bestText, String(best));
      levelBar.style.width = `${(lines % 10) * 10}%`;
    }

    // Set a stat's text, and animate it only when the value actually changed.
    function popIfChanged(el, text) {
      if (el.textContent !== text) {
        popElement(el, text);
      }
    }

    // ============================================================
    // 15. OVERLAY CARDS (title, pause, game over)
    // ============================================================

    // Show the card that matches the current state, or hide it while playing.
    function refreshOverlay() {
      if (state === 'ready') {
        showOverlay('BLOCK BUSTER', 'Clear lines. Make a bust.', 'Press Enter or Space to start', 'Play', 'start');
      } else if (state === 'paused') {
        showOverlay('PAUSED', 'Take a breather.', 'Press P or Esc to resume', 'Resume', 'pause');
      } else if (state === 'over' && overProgress >= VISIBLE_ROWS) {
        const isNewBest = score > 0 && score > bestAtStart;
        showOverlay(
          'GAME OVER',
          isNewBest ? `New best: ${score}` : `Final score: ${score}`,
          'Press R or Enter to play again',
          'Play again',
          'restart'
        );
      } else {
        hideOverlay();
      }
    }

    // Fill in the card and show it.
    function showOverlay(title, text, hint, buttonLabel, action) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayHint.textContent = hint;
      overlayButton.textContent = buttonLabel;
      overlayButton.hidden = false;
      overlayAction = action;
      overlayEl.classList.remove('hidden');
    }

    // Hide the card.
    function hideOverlay() {
      overlayEl.classList.add('hidden');
      overlayButton.hidden = true;
      overlayAction = null;
    }

    // ============================================================
    // 16. MAIN LOOP
    // ============================================================

    // Draw everything for the current frame.
    function render() {
      drawPlayfield();
      drawHold();
      drawNext();
      updateStats();
    }

    // Runs once per animation frame. Converts real elapsed time into dt seconds.
    function gameLoop(timestamp) {
      if (lastFrameTime === null) {
        lastFrameTime = timestamp;
      }
      // Cap dt so a tab switch does not make the piece jump many rows at once.
      const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
      lastFrameTime = timestamp;

      if (state === 'playing') {
        update(dt);
        updateVisuals(dt);
      }
      if (state !== 'paused') {
        updateEffects(dt);
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // 17. START
    // ============================================================

    best = loadBest();
    layoutCanvases();
    window.addEventListener('resize', layoutCanvases);
    prepareNewGame();
    refreshOverlay();   // shows the title card; the board waits for the player
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
